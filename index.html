<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XD4 Blue Book — Sistema de Gestão Operacional</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545;--blue:#134074;--accent:#3A6EA5;--xd4:#2BA9E0;
  --sky:#EEF3F9;--sky-line:#DCE6F1;--paper:#FFFFFF;
  --ink:#1A2432;--ink-2:#5A6B7F;--ink-3:#8A99AB;--line:#E4EAF1;
  --ok:#1E7B4F;--ok-bg:#E7F4EC;--warn:#B5820A;--warn-bg:#FBF3DE;
  --crit:#B42318;--crit-bg:#FBEAE8;--draft:#8A99AB;--draft-bg:#F0F2F5;
  --shadow:0 1px 2px rgba(11,37,69,.04),0 4px 14px rgba(11,37,69,.06),0 14px 30px -10px rgba(11,37,69,.07);
  --shadow-lg:0 2px 4px rgba(11,37,69,.05),0 14px 34px rgba(11,37,69,.1),0 26px 50px -12px rgba(11,37,69,.14);
  --grid-line:rgba(11,37,69,.035);
}
[data-theme="dark"]{
  --navy:#0A1A30;--blue:#3A6EA5;--accent:#5B9BD5;--xd4:#2BA9E0;
  --sky:#0E1622;--sky-line:#1C2838;--paper:#131C2A;
  --ink:#E6EDF5;--ink-2:#9FB0C4;--ink-3:#6B7C90;--line:#22303F;
  --ok:#3FB98A;--ok-bg:#12291F;--warn:#E3B341;--warn-bg:#2A230E;
  --crit:#F27C6E;--crit-bg:#2A1512;--draft:#6B7C90;--draft-bg:#1A222E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.4),0 14px 30px -10px rgba(0,0,0,.35);
  --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.5),0 26px 50px -12px rgba(0,0,0,.6);
  --grid-line:rgba(255,255,255,.035);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--sky);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--sky-line);border-radius:99px}
svg{display:block}

/* ===== BANNER ===== */
.banner{background:var(--navy);color:#fff;padding:0 20px;height:62px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;border-bottom:3px solid var(--xd4)}
.logo-chip{background:#fff;border-radius:10px;height:42px;width:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:5px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo-chip img{width:100%;height:100%;object-fit:contain;display:block}
.home-logo{width:auto;height:96px;object-fit:contain;margin:8px auto 18px;display:block}
.brand{display:flex;flex-direction:column;line-height:1.1;cursor:pointer;min-width:0;overflow:hidden}
.brand .t1{font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .t2{font-weight:400;font-size:10px;color:#9FB4CE;letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.clock{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#9FB4CE;text-align:right;line-height:1.3;flex-shrink:0}
.clock b{color:#fff;display:block;font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#9FB4CE;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.icon-btn svg{width:18px;height:18px}
.kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:2px 6px;color:#cfe0f2}

/* ===== LAYOUT ===== */
.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 62px)}

/* ===== TREE ===== */
.tree{background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:8px 0 40px;transition:background .3s}
.tree-search{margin:16px 14px;display:flex;align-items:center;gap:9px;height:40px;padding:0 13px;background:var(--sky);border:1px solid var(--sky-line);border-radius:9px;color:var(--ink-3);transition:border-color .15s,box-shadow .15s}
.tree-search:focus-within{border-color:var(--accent);background:var(--paper);box-shadow:0 0 0 3px rgba(58,110,165,.12)}
.tree-search input{background:none;border:none;outline:none;flex:1;font-size:13.5px;color:var(--ink)}
.tree-search svg{width:15px;height:15px;flex-shrink:0}
.tree-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:14px 18px 8px;display:flex;align-items:center;gap:7px}
.node-row{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .1s;font-size:14px}
.node-row:hover{background:var(--sky)}
.node-row.active{background:var(--sky);border-left-color:var(--xd4)}
.caret{width:15px;height:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .15s;color:var(--ink-3)}
.node.open>.node-row>.caret{transform:rotate(90deg)}
.caret.leaf{visibility:hidden}
.node-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--sky);color:var(--accent);border:1px solid var(--sky-line)}
.node-ic svg{width:13px;height:13px}
.node-lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.node-lbl b{font-weight:600}
.node-badge{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.02em;color:var(--ink-3);flex-shrink:0}
.node-st{width:8px;height:8px;border-radius:99px;flex-shrink:0}
.st-ok{background:var(--ok)}.st-warn{background:var(--warn)}.st-draft{background:var(--draft)}.st-crit{background:var(--crit)}
.children{display:none;padding-left:20px;border-left:1px dashed var(--sky-line);margin-left:28px}
.node.open>.children{display:block}
.node.root>.node-row{font-weight:600}
.node.root>.node-row .node-ic{background:var(--navy);color:#fff;border-color:var(--navy)}
.node.pinned>.node-row .node-lbl::after{content:"★";color:var(--xd4);font-size:10px;margin-left:6px}

/* ===== READER / CONTENT ===== */
.content{overflow-y:auto;scroll-behavior:smooth;position:relative;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:36px 36px}
.progress-bar{position:sticky;top:0;height:3px;background:transparent;z-index:20}
.progress-bar .fill{height:100%;width:0;background:var(--xd4);transition:width .1s}
.view{display:none}.view.active{display:block}

/* HOME */
.home{max-width:1060px;margin:0 auto;padding:24px 28px 80px}
.home-hero{text-align:center;padding:36px 0 30px}
.home-hero .badge-top{display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:var(--paper);border:1px solid var(--sky-line);padding:5px 13px;border-radius:99px;margin-bottom:16px}
.home-hero .badge-top svg{width:14px;height:14px;flex-shrink:0}
.home-hero h1{font-size:33px;color:var(--ink);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.home-hero .navy-txt{color:var(--xd4)}
.home-hero p{color:var(--ink-2);margin-top:10px;font-size:15.5px;line-height:1.6;max-width:560px;margin-inline:auto}
.home-search{max-width:540px;margin:22px auto 0;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;background:var(--paper);border:1px solid var(--sky-line);border-radius:12px;box-shadow:var(--shadow)}
.home-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(58,110,165,.12)}
.home-search input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;color:var(--ink);background:none}
.home-search svg{width:18px;height:18px;color:var(--ink-3)}

.home-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:32px 0}
.hstat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 18px;text-align:center;box-shadow:var(--shadow)}
.hstat .num{font-size:32px;font-weight:600;color:var(--ink);line-height:1;font-family:'IBM Plex Mono',monospace;letter-spacing:-.01em}
.hstat .lbl{font-size:11.5px;color:var(--ink-3);margin-top:8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hstat .num.ok{color:var(--ok)}.hstat .num.warn{color:var(--warn)}

.dash-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-bottom:36px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
.health{display:flex;align-items:center;gap:24px;height:210px}
.donut{width:130px;height:130px;flex-shrink:0}
.health-legend{flex:1;display:flex;flex-direction:column;gap:10px}
.hl-row{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:2px 0}
.hl-row .d{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.hl-row .v{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink)}
.hl-row .lbl{color:var(--ink-2)}

.feed{display:flex;flex-direction:column;gap:2px;height:210px;overflow-y:auto;padding-right:6px}
.feed::-webkit-scrollbar{width:6px}
.feed::-webkit-scrollbar-track{background:transparent}
.feed::-webkit-scrollbar-thumb{background:var(--sky-line);border-radius:99px}
.feed::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
.feed-row{display:flex;align-items:flex-start;gap:13px;padding:12px 0;border-top:1px solid var(--line)}
.feed-row:first-child{border-top:none}
.feed-ic{width:30px;height:30px;border-radius:8px;background:var(--sky);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent);font-size:13px}
.feed-tx{flex:1;font-size:13.5px}
.feed-tx small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px;font-family:'IBM Plex Mono',monospace}

.home-sec-label{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:8px 4px 18px;display:flex;align-items:center;gap:9px}
.home-sec-label::before{content:"";width:16px;height:2px;background:var(--accent);border-radius:2px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px}
.cat-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.cat-card::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:var(--accent);opacity:.05;transition:transform .3s}
.cat-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.cat-card:hover::after{transform:scale(1.4)}
.cat-ic{width:54px;height:54px;border-radius:13px;background:linear-gradient(135deg,var(--xd4),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:15px}
.cat-ic svg{width:28px;height:28px}
.cat-card h2{font-size:18px;color:var(--ink);font-weight:700;letter-spacing:-.005em}
.cat-card .desc{color:var(--ink-2);font-size:13.5px;line-height:1.55;margin-top:6px}
.cat-card .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;background:var(--sky);border:1px solid var(--sky-line);border-radius:99px;padding:5px 12px;color:var(--ink-2)}

.live-dot{width:7px;height:7px;border-radius:99px;background:var(--ok);box-shadow:0 0 0 3px rgba(30,123,79,.18);animation:lbPulse 2s infinite}
.fleet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:32px}
.fleet-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s;box-shadow:var(--shadow)}
.fleet-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.fleet-img{position:relative;height:120px;background:linear-gradient(135deg,var(--navy),var(--blue));overflow:hidden}
.fleet-img img{width:100%;height:100%;object-fit:cover;display:block}
.fleet-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85)}
.fleet-img-ph svg{width:34px;height:34px}
.fleet-status{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;padding:4px 10px 4px 8px;border-radius:99px;backdrop-filter:blur(3px)}
.fleet-status .d{width:6px;height:6px;border-radius:99px}
.fleet-status.ok{background:rgba(30,123,79,.85);color:#fff}
.fleet-status.ok .d{background:#fff}
.fleet-status.warn{background:rgba(181,130,10,.88);color:#fff}
.fleet-status.warn .d{background:#fff}
.fleet-body{padding:14px 16px 16px}
.fleet-name{font-size:14.5px;font-weight:600;color:var(--ink)}
.fleet-meta{font-size:12px;color:var(--ink-3);margin-top:3px}
.fleet-maint{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
.fleet-maint b{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink-2)}
.chip .d{width:6px;height:6px;border-radius:99px}

/* GROUP LISTING (Veículos Aéreos/Terrestres, Diários) */
.grp{max-width:980px;margin:0 auto;padding:32px 40px 100px}
.grp-head{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 26px;box-shadow:var(--shadow);margin-bottom:24px;flex-wrap:wrap}
.grp-head .gh-ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.grp-head .gh-ic svg{width:26px;height:26px}
.grp-head h1{font-size:21px;color:var(--ink);font-weight:600}
.grp-head .gh-sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.grp-head .gh-count{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--sky);border:1px solid var(--sky-line);padding:7px 14px;border-radius:99px;white-space:nowrap}
.grp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}

/* ---- NAVEGAÇÃO PREMIUM: Área → Processo → Ativo → Documentação ---- */
.grp2{max-width:1400px;margin:0 auto;padding:28px 40px 100px}
.grp2-head{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.grp2-head .gh2-ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.grp2-head .gh2-ic svg{width:19px;height:19px}
.grp2-head h1{font-size:19px;color:var(--ink);font-weight:600;line-height:1.25}
.grp2-head .gh2-sub{color:var(--ink-3);font-size:12px;margin-top:2px}
.grp2-head .gh2-count{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--sky);border:1px solid var(--sky-line);padding:6px 13px;border-radius:99px;white-space:nowrap}

.proc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
@media(min-width:1180px){ .proc-grid{grid-template-columns:repeat(3,1fr)} }
@media(min-width:1500px){ .proc-grid{grid-template-columns:repeat(4,1fr)} }
.proc-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px 22px;cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s;box-shadow:var(--shadow-sm);position:relative}
.proc-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.proc-card .pc-ic{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:16px;transition:transform .22s}
.proc-card:hover .pc-ic{transform:scale(1.06)}
.proc-card .pc-ic svg{width:23px;height:23px}
.proc-card h3{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:6px}
.proc-card .pc-desc{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-bottom:18px;min-height:38px}
.proc-card .pc-foot{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--sky-line)}
.proc-card .pc-count{font-size:12px;font-weight:700;color:var(--xd4)}
.proc-card .pc-arrow{width:26px;height:26px;border-radius:99px;background:var(--sky);display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:.22s;flex-shrink:0}
.proc-card .pc-arrow svg{width:14px;height:14px}
.proc-card:hover .pc-arrow{background:var(--accent);color:#fff;transform:translateX(3px)}

.asset-grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.asset-card2{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:17px 16px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px}
.asset-card2:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.asset-card2 .ac-ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff}
.asset-card2 .ac-ic svg{width:17px;height:17px}
.asset-card2 h5{font-size:13px;font-weight:600;color:var(--ink);line-height:1.35}
.asset-card2 .ac-foot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);margin-top:auto}
.asset-card2 .ac-foot .d{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.doc-hub-note{font-size:13px;color:var(--ink-2);margin:-10px 0 22px;max-width:680px;line-height:1.6}
.doc-hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.doc-hub-card{display:flex;align-items:center;gap:13px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s,border-color .2s}
.doc-hub-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.doc-hub-card .dh-ic{width:36px;height:36px;border-radius:10px;background:var(--sky);border:1px solid var(--sky-line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0}
.doc-hub-card .dh-ic svg{width:18px;height:18px}
.doc-hub-card h5{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:3px}
.doc-hub-card .dh-status{font-size:10.5px;color:var(--warn);font-weight:700;text-transform:uppercase;letter-spacing:.03em}

@media(max-width:680px){ .grp2{padding:20px 18px 80px} }
.grp-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s;box-shadow:var(--shadow);display:flex;flex-direction:column}
.grp-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.grp-card .thumb{width:100%;height:132px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;overflow:hidden}
.grp-card .thumb svg{width:44px;height:44px}
.grp-card .thumb img{width:100%;height:100%;object-fit:cover}
.grp-card .body{padding:16px 17px 17px;display:flex;flex-direction:column;gap:6px;flex:1}
.grp-card .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--xd4);font-weight:700}
.grp-card h4{font-size:15.5px;color:var(--ink);font-weight:600;line-height:1.3}
.grp-card .meta{font-size:12.5px;color:var(--ink-2)}
.grp-card .foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grp-card .foot .st{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.grp-card .foot .st .d{width:7px;height:7px;border-radius:50%}
.grp-card .foot .badge2{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sky);color:var(--ink-2);border:1px solid var(--sky-line)}
@media(max-width:680px){ .grp{padding:24px 18px 80px} .grp-grid{grid-template-columns:1fr 1fr} }
@media(max-width:420px){ .grp-grid{grid-template-columns:1fr} }

/* DOC READER */
.doc{max-width:840px;margin:0 auto;padding:36px 56px 140px;position:relative}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);margin-bottom:22px;flex-wrap:wrap}
.crumbs a{cursor:pointer}.crumbs a:hover{color:var(--accent)}
.crumbs .sep{opacity:.5}
.back-btn{width:26px;height:26px;border-radius:8px;background:var(--sky);border:1px solid var(--sky-line);color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-right:2px;transition:.15s}
.back-btn svg{width:15px;height:15px}
.back-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.cover{text-align:center;padding:18px 0 30px;border-bottom:2px solid var(--sky-line);margin-bottom:28px}
.cover .doc-ic{width:64px;height:64px;border-radius:15px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff}
.cover .doc-ic svg{width:32px;height:32px}
.cover h1{font-size:26px;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.cover .sub{color:var(--xd4);font-weight:600;margin-top:6px;letter-spacing:.4px;font-size:14px}
.cover .tag{color:var(--ink-3);font-size:13px;line-height:1.55;margin-top:14px;font-style:italic;max-width:600px;margin-inline:auto}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px;box-shadow:var(--shadow)}
.ctrl .c{padding:13px 16px;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.ctrl .c:nth-child(-n+4){border-top:none}.ctrl .c:nth-child(4n){border-right:none}
.ctrl .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.ctrl .v{font-size:14px;font-weight:500;margin-top:4px}
.ctrl .v.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px}
.copy-code{cursor:pointer;border-bottom:1px dashed var(--ink-3)}
.copy-code:hover{color:var(--accent);border-color:var(--accent)}

.chapindex{background:linear-gradient(180deg,var(--sky),var(--paper));border:1px solid var(--sky-line);border-radius:12px;padding:22px 24px 16px;margin-bottom:32px;box-shadow:var(--shadow)}
.chapindex h4{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.chapindex h4::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
.chapindex .cols{display:grid;grid-template-columns:1fr 1fr;gap:1px 34px;min-width:0}
.chapindex a{display:flex;align-items:baseline;text-decoration:none;color:var(--ink-2);font-size:13px;padding:7px 5px;border-radius:6px;transition:.12s;cursor:pointer;min-width:0}
.chapindex a:hover{background:var(--sky);color:var(--ink)}
.chapindex a .n{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-weight:600;font-size:12px;min-width:32px;margin-right:8px;flex-shrink:0}
.chapindex a .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
.chapindex a .dots{flex:1;min-width:8px;border-bottom:1px dotted var(--sky-line);margin:0 8px;transform:translateY(-3px)}

h2.sec{font-size:20px;font-weight:700;color:var(--ink);margin:38px 0 14px;padding-bottom:9px;border-bottom:2px solid var(--sky-line);display:flex;gap:12px;align-items:baseline;scroll-margin-top:20px}
h2.sec .sn{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:16px}
h3.sub{font-size:16px;font-weight:600;color:var(--blue);margin:24px 0 9px;display:flex;gap:10px;scroll-margin-top:20px}
h3.sub .sn{font-family:'IBM Plex Mono',monospace;color:var(--ink-3);font-size:14px}
.doc p{margin:10px 0;color:var(--ink)}
.doc ul{margin:10px 0 10px 4px;list-style:none}
.doc li{padding:6px 0 6px 22px;position:relative;color:var(--ink)}
.doc li::before{content:"•";position:absolute;left:5px;color:var(--accent);font-weight:700}
.callout{border-radius:8px;padding:16px 18px;margin:20px 0;display:flex;gap:12px;font-size:14px;line-height:1.6;box-shadow:var(--shadow)}
.callout .ci{flex-shrink:0;margin-top:1px;font-size:16px}
.callout b{display:block;text-transform:uppercase;letter-spacing:.05em;font-size:11.5px;margin-bottom:3px}
.callout.crit{background:var(--crit-bg);border:1px solid rgba(180,35,24,.25);color:var(--ink)}.callout.crit b{color:var(--crit)}
.callout.warn{background:var(--warn-bg);border:1px solid rgba(181,130,10,.25);color:var(--ink)}.callout.warn b{color:var(--warn)}
.callout.note{background:var(--sky);border:1px solid var(--sky-line);color:var(--ink-2)}.callout.note b{color:var(--blue)}
.doc table{width:100%;border-collapse:collapse;margin:20px 0;font-size:13.5px;border:1px solid var(--sky-line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.doc table thead th{background:var(--navy);color:#fff;text-align:left;padding:11px 13px;font-weight:600;font-size:12.5px}
.doc table tbody td{padding:10px 13px;border-top:1px solid var(--sky-line);color:var(--ink);vertical-align:top}
.doc table tbody tr:nth-child(even){background:var(--sky)}
.doc table th[colspan]{text-align:center}
.doc-foot{margin-top:48px;padding-top:22px;border-top:2px solid var(--sky-line);text-align:center;color:var(--ink-3);font-size:13px;font-style:italic}

/* scrollspy TOC */
.spy{position:fixed;top:100px;right:24px;width:200px;max-height:70vh;overflow-y:auto;font-size:12px;display:none;padding-left:14px;border-left:1px solid var(--line)}
.spy.show{display:block}
.spy a{display:block;padding:4px 0;color:var(--ink-3);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.1s}
.spy a:hover{color:var(--accent)}
.spy a.active{color:var(--xd4);font-weight:600}
@media(max-width:1400px){.spy{display:none!important}}

/* PLACEHOLDER DOC */
.ph{max-width:760px;margin:0 auto;padding:48px 40px}
.ph-head{text-align:center;margin-bottom:32px}
.ph-ic{width:76px;height:76px;border-radius:18px;margin:0 auto 18px;background:var(--sky);border:1px solid var(--sky-line);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ph-ic svg{width:36px;height:36px}
.ph-head h1{font-size:23px;color:var(--ink);font-weight:600}
.ph-head .code{font-family:'IBM Plex Mono',monospace;color:var(--ink-3);font-size:13px;margin-top:6px}
.ph-status{display:inline-flex;align-items:center;gap:7px;margin-top:14px;height:28px;padding:0 14px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--sky);color:var(--accent);border:1px solid var(--sky-line)}
.ph-status .d{width:7px;height:7px;border-radius:99px;background:var(--accent)}
.ph-note{background:var(--sky);border:1px dashed var(--sky-line);border-radius:12px;padding:20px 24px;color:var(--ink-2);font-size:14px;text-align:center;margin-bottom:28px}
.ph-skel h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-bottom:14px}
.ph-skel-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;color:var(--ink-3);background:var(--paper)}
.ph-skel-row .n{font-family:'IBM Plex Mono',monospace;color:var(--ink-3);font-weight:600;font-size:12.5px;flex-shrink:0}
.ph-skel-row .bar{flex:1;height:8px;border-radius:99px;background:var(--sky-line);opacity:.6}

/* MANUAIS (PDF do repositório GitHub) — lista em linhas, estilo screenshot */
.manual-panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.manual-tab{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--sky);border-bottom:1px solid var(--line);padding:10px 18px;border-right:1px solid var(--line)}
.manual-list{display:flex;flex-direction:column}
.manual-row{display:flex;align-items:center;gap:16px;padding:17px 20px;border-top:1px solid var(--line);text-decoration:none;color:inherit;transition:background .15s,box-shadow .15s;cursor:pointer}
.manual-row:first-child{border-top:none}
.manual-row:hover{background:var(--sky);box-shadow:inset 3px 0 0 var(--accent)}
.manual-row.missing{cursor:default}
.manual-row.missing:hover{background:none}
.mr-ic{display:flex;flex-direction:column;align-items:center;gap:3px;width:44px;flex-shrink:0;color:var(--accent)}
.mr-ic svg{width:22px;height:22px}
.mr-ic.warn{color:var(--warn)}
.mr-size{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3)}
.mr-info{flex:1;min-width:0;padding-left:16px;border-left:1px solid var(--sky-line)}
.mr-name{font-size:14.5px;color:var(--ink);font-weight:600}
.mr-type{font-size:12px;color:var(--ink-3);margin-top:2px}
.mr-type code{font-size:11px}
.mr-open{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;flex-shrink:0}
.mr-open.warn{color:var(--warn)}

/* VEHICLE PROFILE */
.vp{max-width:860px;margin:0 auto;padding:32px 44px 100px}
.vp-hero{display:flex;gap:24px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);margin-bottom:24px}
.vp-img{width:140px;height:140px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;overflow:hidden}
.vp-img svg{width:60px;height:60px}
.vp-img img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.vp-info{flex:1}
.vp-info .cls{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.vp-info h1{font-size:26px;color:var(--ink);font-weight:600;margin:4px 0 6px}
.vp-info .maker{color:var(--ink-2);font-size:14px}
.vp-ready{display:inline-flex;align-items:center;gap:7px;margin-top:12px;height:28px;padding:0 14px;border-radius:99px;font-size:12.5px;font-weight:500}
.vp-ready .d{width:7px;height:7px;border-radius:99px}
.vp-ready.ok{background:var(--ok-bg);color:var(--ok)}.vp-ready.ok .d{background:var(--ok)}
.vp-ready.warn{background:var(--warn-bg);color:var(--warn)}.vp-ready.warn .d{background:var(--warn)}
.vp-specs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.spec{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}
.spec .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.spec .v{font-size:17px;font-weight:600;color:var(--ink);margin-top:4px;font-family:'IBM Plex Mono',monospace}
.spec .v small{font-size:11px;color:var(--ink-3);font-weight:400}
.vp-docs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.vp-doc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:.16s;box-shadow:var(--shadow)}
.vp-doc:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.vp-doc .di{width:40px;height:40px;border-radius:10px;background:var(--sky);display:flex;align-items:center;justify-content:center;color:var(--accent);margin-bottom:12px}
.vp-doc .di svg{width:20px;height:20px}
.vp-doc h4{font-size:14px;color:var(--ink);font-weight:600}
.vp-doc .st{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:6px}
.vp-doc .st .d{width:7px;height:7px;border-radius:99px}
.vp-maint h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.vp-maint h3::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
.maint-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--paper);font-size:13.5px}
.maint-row .date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);flex-shrink:0;width:80px}
.maint-row .desc{flex:1;color:var(--ink)}
.maint-row .badge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:500}
.maint-row .badge.ok{background:var(--ok-bg);color:var(--ok)}
.maint-row .badge.warn{background:var(--warn-bg);color:var(--warn)}

.backbtn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:18px}
.backbtn:hover{text-decoration:underline}

/* COMMAND PALETTE */
.cmdk-overlay{position:fixed;inset:0;background:rgba(11,37,69,.4);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:14vh}
.cmdk-overlay.show{display:flex}
.cmdk{width:min(600px,92vw);background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.cmdk-input{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmdk-input svg{width:18px;height:18px;color:var(--ink-3)}
.cmdk-input input{flex:1;border:none;outline:none;background:none;font-size:16px;font-family:inherit;color:var(--ink)}
.cmdk-results{max-height:52vh;overflow-y:auto;padding:8px}
.cmdk-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;cursor:pointer}
.cmdk-item.sel,.cmdk-item:hover{background:var(--sky)}
.cmdk-item .ci{width:30px;height:30px;border-radius:7px;background:var(--sky);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.cmdk-item.sel .ci{background:var(--paper)}
.cmdk-item .ci svg{width:15px;height:15px}
.cmdk-item .cl{flex:1;font-size:14px;color:var(--ink)}
.cmdk-item .cl small{display:block;font-size:11.5px;color:var(--ink-3)}
.cmdk-item .ck{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3)}
.cmdk-empty{padding:30px;text-align:center;color:var(--ink-3);font-size:14px}

/* ===== ORGANOGRAMA ===== */
.org{max-width:1080px;margin:0 auto;padding:34px 44px 100px}
.org-head{margin-bottom:26px}
.org-head h1{font-size:26px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:12px}
.org-head h1 svg{width:26px;height:26px;flex-shrink:0}
.org-tab svg{width:15px;height:15px;flex-shrink:0}
.oc-count svg,.od-link svg{width:14px;height:14px}
.org-head p{color:var(--ink-2);font-size:14px;line-height:1.55;margin-top:7px;max-width:680px}
.org-tabs{display:flex;gap:8px;margin:24px 0 32px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;width:fit-content;box-shadow:var(--shadow)}
.org-tab{padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:8px}
.org-tab.active{background:var(--navy);color:#fff}
.org-tab:not(.active):hover{background:var(--sky)}
.org-panel{display:none}
.org-panel.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blueBookSpin{to{transform:rotate(360deg)}}

/* chart: piramidal com linhas */
.chart{display:flex;flex-direction:column;align-items:center;overflow-x:auto;padding:10px 0 20px}
.tier{display:flex;justify-content:center;gap:26px;position:relative;flex-wrap:nowrap}
.tier + .tier{margin-top:44px}
/* connector vertical descendo de um tier para o próximo */
.tier::before{content:"";position:absolute;top:-44px;left:50%;width:2px;height:22px;background:var(--sky-line)}
.tier:first-child::before{display:none}
/* barra horizontal que une irmãos */
.tier.multi::after{content:"";position:absolute;top:-22px;left:var(--barL,25%);right:var(--barR,25%);height:2px;background:var(--sky-line)}
/* cada nó tem um "poste" subindo até a barra */
.onode{position:relative;display:flex;flex-direction:column;align-items:center}
.onode.hasup::before{content:"";position:absolute;top:-22px;left:50%;width:2px;height:22px;background:var(--sky-line)}

.ocard{width:190px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:18px 16px;text-align:center;cursor:pointer;transition:.16s;box-shadow:var(--shadow);position:relative}
.ocard:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.ocard.lvl0{background:linear-gradient(135deg,var(--navy),var(--blue));border-color:var(--navy)}
.ocard.lvl0 .oc-role,.ocard.lvl0 .oc-name{color:#fff}
.ocard.lvl0 .oc-ic{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)}
.ocard.lvl0 .oc-tag{background:rgba(255,255,255,.15);color:#dbe9f7;border-color:transparent}
.oc-ic{width:48px;height:48px;border-radius:12px;background:var(--sky);border:1px solid var(--sky-line);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--accent)}
.oc-ic svg{width:22px;height:22px}
.oc-role{font-size:15px;font-weight:600;color:var(--ink);line-height:1.25}
.oc-name{font-size:12px;color:var(--ink-3);margin-top:4px}
.oc-tag{display:inline-block;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--sky);border:1px solid var(--sky-line);border-radius:99px;padding:3px 10px}
.oc-count{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--xd4);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace}
.oc-flag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--navy);background:var(--warn);border-radius:99px;padding:3px 10px;white-space:nowrap}

/* painel de detalhe do cargo */
.org-detail{margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;box-shadow:var(--shadow);display:none}
.org-detail.show{display:block;animation:fade .2s}
.od-head{display:flex;align-items:center;gap:16px;padding:24px 28px;background:linear-gradient(120deg,var(--sky),transparent);border-bottom:1px solid var(--line)}
.od-ic{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.od-ic svg{width:26px;height:26px}
.od-head h3{font-size:20px;color:var(--ink);font-weight:700}
.od-head .sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.od-body{padding:24px 28px}
.od-body h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.od-body h4::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px}
.od-body ul{list-style:none;margin:0 0 4px}
.od-body li{padding:8px 0 8px 24px;position:relative;font-size:14px;color:var(--ink);border-top:1px solid var(--line)}
.od-body li:first-child{border-top:none}
.od-body li::before{content:"";position:absolute;left:5px;top:15px;width:8px;height:8px;border-radius:99px;background:var(--accent)}
.od-close{margin-left:auto;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex-shrink:0}
.od-close:hover{background:var(--sky);color:var(--ink)}
.od-link{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-size:13px;font-weight:500;color:var(--accent);cursor:pointer}
.od-link:hover{text-decoration:underline}

.org-hint{text-align:center;color:var(--ink-3);font-size:13px;margin-top:8px;font-style:italic}

/* famílias documentais (modo docs) — grid responsivo, não corta lateral */
.docs-chart{align-items:stretch}
.fam-connector{width:2px;height:26px;background:var(--sky-line);margin:0 auto}
.fam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;align-items:start;width:100%;position:relative}
/* barra horizontal ligando o topo às famílias */
.fam-grid::before{content:"";position:absolute;top:-13px;left:12%;right:12%;height:2px;background:var(--sky-line)}
.fam-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.fam-card::before{content:"";position:absolute;top:-13px;left:50%;width:2px;height:13px;background:var(--sky-line)}
.fam-head{display:flex;align-items:center;gap:9px;padding:14px 16px;background:linear-gradient(120deg,var(--sky),transparent);border-bottom:1px solid var(--line)}
.fam-code{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff;background:var(--navy);border-radius:6px;padding:3px 9px;flex-shrink:0;min-width:30px;text-align:center}
.fam-title{font-size:14px;font-weight:600;color:var(--ink);flex:1;line-height:1.25}
.fam-count{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--accent);background:var(--sky);border:1px solid var(--sky-line);border-radius:99px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.fam-items{padding:6px}
.doc-item{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:8px;font-size:12.5px;transition:.12s}
.doc-item + .doc-item{border-top:1px solid var(--line)}
.doc-item.link{cursor:pointer}
.doc-item.link:hover{background:var(--sky)}
.di-dot{width:8px;height:8px;border-radius:99px;flex-shrink:0;background:var(--accent)}
.di-label{flex:1;color:var(--ink);line-height:1.3}
.di-code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);flex-shrink:0}
.doc-item.link .di-label::after{content:"↗";font-size:10px;color:var(--accent);margin-left:5px}
/* subgrupo (veículos aéreos / terrestres dentro de uma família) */
.doc-subgroup{margin:8px 4px 2px;border:1px solid var(--sky-line);border-radius:10px;overflow:hidden;background:var(--sky)}
.doc-subgroup + .doc-subgroup{margin-top:10px}
.dsg-head{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12px;font-weight:600;color:var(--blue);background:var(--paper);border-bottom:1px solid var(--sky-line)}
.dsg-head svg{width:15px;height:15px;flex-shrink:0;color:var(--accent)}
.doc-subgroup .doc-item{background:transparent}
.doc-subgroup .doc-item.link:hover{background:var(--paper)}


@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .tree{position:fixed;top:62px;bottom:0;left:0;width:300px;z-index:35;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg)}
  .tree.open{transform:translateX(0)}
  .mob-tree-btn{display:flex}
  .doc{padding:26px 20px 100px}.ph,.vp{padding:26px 18px 80px}
  .home{padding:18px 16px 70px}
  .ctrl,.home-stats{grid-template-columns:1fr 1fr}
  .dash-grid,.cat-grid{grid-template-columns:1fr}
  .vp-docs{grid-template-columns:1fr 1fr}
  .vp-specs{grid-template-columns:1fr 1fr}
  .chapindex .cols{grid-template-columns:1fr}
  .vp-hero{flex-direction:column;text-align:center}
  .org{padding:22px 14px 70px}
  .ocard{width:150px;padding:13px 11px}
  .tier{gap:14px}.tier + .tier{margin-top:38px}
  .fam-grid{grid-template-columns:1fr;gap:14px}
  .fam-grid::before{display:none}
  .fam-card::before{display:none}
  .fam-connector{display:none}
}
@media(max-width:480px){
  .vp-docs{grid-template-columns:1fr}
}
/* ===== AUTH GATE ===== */
#authGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:40px 20px}
.ag-bg{position:fixed;inset:0;background-image:url('https://images.unsplash.com/photo-1636887584784-954392022b75?auto=format&fit=crop&w=1920&q=80');background-position:center 30%;background-size:cover;background-repeat:no-repeat;filter:saturate(.85) brightness(.75)}
.ag-scrim{position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,14,28,.88) 0%,rgba(8,20,38,.86) 40%,rgba(11,37,69,.94) 100%)}
.ag-content{position:relative;z-index:1;width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;padding:20px 0 10px}
.ag-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.ag-logo{width:34px;height:34px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.ag-logo img{width:100%;height:100%;object-fit:contain}
.ag-brand-t{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;color:#B9C8DC;text-transform:uppercase}
.ag-brand-t b{color:#fff;font-weight:600}
.ag-title{font-size:34px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.ag-subtitle{font-size:14.5px;color:#AFC0D6;margin-bottom:34px}
.ag-card{width:100%;max-width:380px;background:rgba(19,32,54,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35);margin-bottom:22px}
.ag-label{display:block;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:#9FB4CE;margin-bottom:8px}
.ag-inputrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:12px 14px;transition:.15s}
.ag-inputrow:focus-within{border-color:var(--xd4);background:rgba(255,255,255,.12)}
.ag-inputrow svg{width:18px;height:18px;color:#9FB4CE;flex-shrink:0}
.ag-inputrow input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:15px;font-family:inherit;min-width:0}
.ag-inputrow input::placeholder{color:#7488A3}
.ag-eye{color:#9FB4CE;flex-shrink:0;display:flex;padding:2px}
.ag-eye svg{width:18px;height:18px}
.ag-eye:hover{color:#fff}
.ag-error{display:none;text-align:left;color:#F27C6E;font-size:12.5px;margin-top:9px}
.ag-error.show{display:block}
.ag-card.shake{animation:agShake .4s}
@keyframes agShake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.ag-submit{width:100%;margin-top:16px;background:linear-gradient(135deg,var(--xd4),var(--blue));color:#fff;border:none;border-radius:10px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s;box-shadow:0 8px 20px rgba(43,169,224,.3)}
.ag-submit:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ag-submit:active{transform:translateY(0)}
.ag-footer{font-size:12px;color:#7C90AB;max-width:420px;margin-top:6px}
#authGate.hidden{display:none}
/* ===== DIGITAL LOGBOOK — AVIATION TECHNICAL LOG STYLE ===== */
/* Cabeçalho estilo "Aircraft Technical Log": tarja de identificação,
   placa de matrícula e faixa XD4, evocando documentação aeronáutica oficial. */
.lb-head{position:relative;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);border:1px solid var(--navy);border-radius:16px;padding:0;box-shadow:0 10px 30px rgba(11,37,69,.22);margin-bottom:22px;overflow:hidden}
.lb-head::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,var(--xd4) 0,var(--xd4) 34px,transparent 34px,transparent 44px)}
.lb-head-main{display:flex;align-items:center;gap:18px;padding:22px 26px 20px;flex-wrap:wrap}
.lb-head .lb-ic{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;backdrop-filter:blur(4px)}
.lb-head .lb-ic svg{width:27px;height:27px}
.lb-head h1{font-size:20px;color:#fff;font-weight:700;letter-spacing:.01em}
.lb-head .lb-sub{color:rgba(226,238,250,.82);font-size:13px;margin-top:3px;max-width:640px}
.lb-head .lb-docmeta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.lb-head .lb-chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#dceaf7;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);padding:3px 9px;border-radius:6px}
.lb-head .lb-chip b{color:#fff;font-weight:700}
.lb-status{margin-left:auto;align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2);transition:.2s;white-space:nowrap}
.lb-status .d{width:7px;height:7px;border-radius:50%;background:#F2C744;box-shadow:0 0 0 3px rgba(242,199,68,.25);animation:lbPulse 2s infinite}
.lb-status.saved{background:rgba(63,185,138,.22);border-color:rgba(63,185,138,.4)}
.lb-status.saved .d{background:#3FB98A;box-shadow:0 0 0 3px rgba(63,185,138,.28);animation:none}
@keyframes lbPulse{0%,100%{opacity:1}50%{opacity:.45}}
/* Barra de matrícula (tail number strip) */
.lb-tailstrip{display:flex;align-items:stretch;border-top:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.14)}
.lb-tailstrip .cell{flex:1;padding:9px 20px;border-right:1px solid rgba(255,255,255,.10);min-width:0}
.lb-tailstrip .cell:last-child{border-right:none}
.lb-tailstrip .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(198,216,235,.72);font-weight:600}
.lb-tailstrip .v{font-family:'IBM Plex Mono',monospace;font-size:14px;color:#fff;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.lb-section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;transition:box-shadow .2s}
.lb-section:hover{box-shadow:0 6px 22px rgba(11,37,69,.09)}
.lb-section>h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:700;margin:0;display:flex;align-items:center;gap:10px;padding:14px 24px;background:var(--sky);border-bottom:1px solid var(--line);counter-increment:lbsec}
.lb-section>h3::before{content:counter(lbsec,decimal-leading-zero);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:#fff;background:var(--accent);width:26px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.lb-section>h3 svg{width:15px;height:15px;color:var(--accent)}
.lb-section>*:not(h3){margin-left:24px;margin-right:24px}
.lb-section>h3+*{margin-top:20px}
.lb-section>*:last-child{margin-bottom:22px}
.doc>.lb-section-wrap,.lb-section-wrap{counter-reset:lbsec}

.lb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.lb-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:6px;font-weight:600}
.lb-field input,.lb-field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--sky);color:var(--ink);font-size:14px;font-family:inherit;transition:.15s}
.lb-field input:focus,.lb-field select:focus{outline:none;border-color:var(--xd4);background:var(--paper);box-shadow:0 0 0 3px rgba(43,169,224,.12)}
.lb-field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--sky);color:var(--ink);font-size:14px;line-height:1.55;font-family:inherit;transition:.15s;resize:vertical;min-height:78px}
.lb-field textarea:focus{outline:none;border-color:var(--xd4);background:var(--paper);box-shadow:0 0 0 3px rgba(43,169,224,.12)}
.lb-field input[readonly]{color:var(--ink-2);background:var(--sky);cursor:default}
.lb-field.ro .static{padding:9px 11px;background:var(--sky);border-radius:9px;font-size:14px;color:var(--ink);font-weight:600;border:1px solid var(--line)}

.lb-ops{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lb-op-card{background:var(--sky);border:1px solid var(--sky-line);border-radius:12px;padding:16px}
.lb-op-card .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--xd4);font-weight:700;margin-bottom:10px}
.lb-op-card .lb-grid{grid-template-columns:1fr 1fr}

.lb-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);box-shadow:inset 0 1px 3px rgba(11,37,69,.04)}
table.lb-table{width:100%;border-collapse:collapse;min-width:820px}
table.lb-table thead th{background:linear-gradient(180deg,var(--navy),var(--blue));color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:11px 8px;text-align:center;font-weight:600;white-space:nowrap;border-right:1px solid rgba(255,255,255,.08)}
table.lb-table thead th:last-child{border-right:none}
table.lb-table tbody td{padding:5px;border-top:1px solid var(--line);border-right:1px solid var(--line);text-align:center;background:var(--paper)}
table.lb-table tbody td:last-child{border-right:none}
table.lb-table tbody tr:nth-child(even) td{background:var(--sky)}
table.lb-table tbody tr:hover td{background:rgba(43,169,224,.06)}
table.lb-table input,table.lb-table select{width:100%;border:1px solid transparent;background:transparent;text-align:center;padding:7px 4px;border-radius:6px;font-size:13px;color:var(--ink);font-family:'IBM Plex Mono',monospace;transition:.12s}
table.lb-table input:focus,table.lb-table select:focus{outline:none;border-color:var(--xd4);background:var(--paper);box-shadow:0 0 0 2px rgba(43,169,224,.14)}
table.lb-table input[readonly]{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
table.lb-table td.lb-local input{min-width:100px;font-family:'IBM Plex Sans',sans-serif}
.lb-rowdel{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);transition:.15s}
.lb-rowdel:hover{background:var(--crit-bg);color:var(--crit)}
.lb-rowdel svg{width:14px;height:14px}
.lb-sig{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:transparent;transition:.15s;background:var(--paper)}
.lb-sig.on{background:var(--ok);border-color:var(--ok);color:#fff}
.lb-sig svg{width:13px;height:13px}
.lb-addrow{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:13px;font-weight:600;color:var(--xd4);padding:8px 4px}
.lb-addrow:hover{text-decoration:underline}
.lb-addrow svg{width:15px;height:15px}
.lb-tfoot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.lb-tfoot .item{text-align:center;background:linear-gradient(180deg,var(--navy),var(--blue));border-radius:11px;padding:14px 12px;position:relative;overflow:hidden}
.lb-tfoot .item::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--xd4)}
.lb-tfoot .k{font-size:10px;text-transform:uppercase;color:rgba(198,216,235,.8);letter-spacing:.07em;margin-bottom:6px;font-weight:600}
.lb-tfoot .v{font-size:24px;font-weight:700;color:#fff;font-family:'IBM Plex Mono',monospace;line-height:1;font-variant-numeric:tabular-nums}
[data-theme="dark"] .lb-tfoot .v{color:#fff}

.lb-occ textarea{width:calc(100% - 48px);min-height:90px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--sky);color:var(--ink);font-family:inherit;font-size:14px;resize:vertical}
.lb-occ textarea:focus{outline:none;border-color:var(--xd4);background:var(--paper)}

.lb-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:4px}
.lb-save{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(135deg,var(--xd4),var(--blue));color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:14.5px;font-weight:600;box-shadow:0 8px 20px rgba(43,169,224,.28);transition:.15s}
.lb-save:hover{filter:brightness(1.07);transform:translateY(-1px)}
.lb-save svg{width:17px;height:17px}
.lb-print{display:inline-flex;align-items:center;gap:8px;background:var(--sky);color:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:12px 18px;font-size:13.5px;font-weight:600;transition:background .15s,color .15s,box-shadow .15s}
.lb-print:hover{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.lb-print svg{width:15px;height:15px}
.lb-hint{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.lb-hint svg{width:13px;height:13px;flex-shrink:0}

.lb-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:13px 22px;border-radius:11px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:500;opacity:0;pointer-events:none;transition:.25s}
.lb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lb-toast svg{width:17px;height:17px;color:#3FB98A;flex-shrink:0}

/* ===== RISK ASSESSMENT — chips, pills e medidor de risco ===== */
.ra-chipgrid{display:flex;flex-wrap:wrap;gap:10px}
.ra-chip{display:flex;align-items:center;gap:9px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--sky);font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s;user-select:none}
.ra-chip:hover{border-color:var(--accent);color:var(--ink)}
.ra-chip .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;background:var(--paper);flex-shrink:0;transition:.15s}
.ra-chip .box svg{width:11px;height:11px}
.ra-chip.on{background:rgba(43,169,224,.10);border-color:var(--xd4);color:var(--ink)}
.ra-chip.on .box{background:var(--xd4);border-color:var(--xd4);color:#fff}
.ra-chip.on.hazard{background:var(--warn-bg);border-color:var(--warn)}
.ra-chip.on.hazard .box{background:var(--warn);border-color:var(--warn)}
.ra-chip .lbl{white-space:nowrap}
.ra-chip .ic{width:16px;height:16px;color:var(--ink-3);flex-shrink:0}
.ra-chip.on .ic{color:var(--xd4)}
.ra-qual{margin-left:2px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--paper);color:var(--ink);width:160px;font-family:inherit}
.ra-qual:focus{outline:none;border-color:var(--xd4)}
.ra-outrostxt{margin-top:12px;width:calc(100% - 4px);border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--sky);color:var(--ink);font-family:inherit;font-size:13.5px;resize:vertical;min-height:44px}
.ra-outrostxt:focus{outline:none;border-color:var(--xd4);background:var(--paper)}

.ra-qa{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--sky-line)}
.ra-qa:last-child{border-bottom:none}
.ra-qa .q{font-size:13.5px;color:var(--ink);flex:1;line-height:1.5}
.ra-qa .q b{color:#fff;background:var(--ink-3);font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 6px;border-radius:5px;margin-right:9px}
.ra-yn{display:flex;gap:6px;flex-shrink:0}
.ra-yn button{padding:7px 13px;border-radius:8px;border:1.5px solid var(--line);background:var(--sky);font-size:12px;font-weight:700;color:var(--ink-2);transition:.15s;text-transform:uppercase;letter-spacing:.03em}
.ra-yn button:hover{border-color:var(--accent)}
.ra-yn button.sel-sim{background:var(--ok);border-color:var(--ok);color:#fff}
.ra-yn button.sel-nao{background:var(--crit);border-color:var(--crit);color:#fff}
.ra-yn button.sel-na{background:var(--ink-3);border-color:var(--ink-3);color:#fff}

.ra-risk{display:flex;align-items:center;gap:16px;padding:16px 20px}

.ra-risk .badge .n{font-size:22px;font-weight:800;font-family:'IBM Plex Mono',monospace;line-height:1}

.ra-risk.low .badge{background:var(--ok-bg);color:var(--ok)}
.ra-risk.med .badge{background:var(--warn-bg);color:var(--warn)}
.ra-risk.high .badge{background:var(--crit-bg);color:var(--crit)}
.ra-risk-main{flex:1;min-width:0}
.ra-risk-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ra-risk-label{font-size:13px;font-weight:700;color:var(--ink)}
.ra-risk-level{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:99px}
.ra-risk.low .ra-risk-level{background:var(--ok-bg);color:var(--ok)}
.ra-risk.med .ra-risk-level{background:var(--warn-bg);color:var(--warn)}
.ra-risk.high .ra-risk-level{background:var(--crit-bg);color:var(--crit)}
.ra-risk-bar{height:9px;border-radius:99px;background:var(--sky-line);overflow:hidden}
.ra-risk-bar .fill{height:100%;border-radius:99px;transition:width .35s ease,background .35s ease}
.ra-risk-hint{font-size:11.5px;color:var(--ink-3);margin-top:7px}

.ra-declare{background:var(--sky);border:1px solid var(--sky-line);border-radius:12px;padding:16px 18px;font-size:13.5px;color:var(--ink-2);line-height:1.7}

.ra-agree .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;background:var(--paper);flex-shrink:0;margin-top:1px;transition:.15s}
.ra-agree .box svg{width:12px;height:12px}
.ra-agree.on .box{background:var(--ok);border-color:var(--ok);color:#fff}

/* ===== ASSINATURA DIGITAL — modal com canvas ===== */
.lb-sig{overflow:hidden}
.lb-sig img{display:block}
.sig-modal-overlay{position:fixed;inset:0;background:rgba(11,37,69,.55);backdrop-filter:blur(2px);z-index:900;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.sig-modal-overlay.show{opacity:1;pointer-events:auto}
.sig-modal{background:var(--paper);border-radius:16px;box-shadow:var(--shadow-lg);width:min(560px,92vw);padding:20px 22px 22px;transform:translateY(10px);transition:.2s}
.sig-modal-overlay.show .sig-modal{transform:translateY(0)}
.sig-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.sig-modal-head h4{font-size:15.5px;font-weight:700;color:var(--ink)}
.sig-close{width:30px;height:30px;border-radius:8px;font-size:20px;line-height:1;color:var(--ink-3);display:flex;align-items:center;justify-content:center;transition:.15s}
.sig-close:hover{background:var(--sky);color:var(--ink)}
.sig-modal-hint{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
.sig-canvas-wrap{position:relative;width:100%;height:230px;background:var(--sky);border:1.5px dashed var(--sky-line);border-radius:12px;overflow:hidden;touch-action:none}
.sig-canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.sig-baseline{position:absolute;left:8%;right:8%;bottom:32%;height:1px;background:var(--line);pointer-events:none}
.sig-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.sig-btn{padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.sig-btn svg{width:14px;height:14px}
.sig-btn.ghost{background:var(--sky);color:var(--ink-2);border:1px solid var(--line)}
.sig-btn.ghost:hover{background:var(--paper);color:var(--ink)}
.sig-btn.primary{background:linear-gradient(135deg,var(--xd4),var(--blue));color:#fff;box-shadow:0 8px 18px rgba(43,169,224,.28)}
.sig-btn.primary:hover{filter:brightness(1.07)}

.ra-sig-block{margin-top:16px}
.ra-sig-block label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:8px;font-weight:600}
.ra-sig-pad{height:110px;border:1.5px dashed var(--sky-line);border-radius:12px;background:var(--sky);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;overflow:hidden;position:relative}
.ra-sig-pad:hover{border-color:var(--xd4);background:var(--paper)}
.ra-sig-pad img{max-height:100%;max-width:100%;object-fit:contain}
.ra-sig-pad .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-3);font-size:12.5px;font-weight:600}
.ra-sig-pad .ph svg{width:22px;height:22px}
.ra-sig-pad.signed{border-style:solid;border-color:var(--ok)}
.ra-sig-redo{margin-top:8px;font-size:12px;color:var(--xd4);font-weight:600;display:inline-flex;align-items:center;gap:5px;cursor:pointer}

@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;box-shadow:none!important}
  body{background:#fff!important}
  .banner,.tree-panel,.crumbs,.lb-actions,.lb-addrow,.lb-rowdel,.mob-tree-btn,.lb-status,.lb-toast,.sig-modal-overlay,.ra-sig-redo,.lb-hint,.imgzone .imgbtn.danger,.imgzone .imgbtn.draw,.gallery-item .gdel,.tbl-rowdel,.tbl-addrow,.etapa-del,.diag-overlay{display:none!important}
  .content{overflow:visible!important;padding:0!important}
  .lb-section-wrap{max-width:100%!important}
  .lb-section{border:1px solid #ccc!important;break-inside:avoid;margin-bottom:10px!important}
  .lb-section>h3{background:#f2f2f2!important;color:#222!important}
  .lb-section>h3::before{background:var(--accent)!important;color:#fff!important}
  .lb-head{border:1px solid var(--navy)!important;break-inside:avoid;background:var(--navy)!important}
  .lb-head *{color:#fff!important}
  .lb-tfoot .item,table.lb-table thead th{background:var(--navy)!important;color:#fff!important}

  /* Formulário: campos viram linhas de preenchimento, sem caixas cinza */
  .lb-field input,.lb-field select,.lb-field .static,.ra-outrostxt,.ra-qual{
    border:none!important;background:transparent!important;padding:2px 0 3px!important;
    border-bottom:1px solid #999!important;border-radius:0!important;color:#111!important}
  .lb-field label{color:#555!important;font-size:9.5px!important}
  .lb-occ textarea{border:1px solid #ccc!important;background:#fff!important}

  /* Checklists (Equipamento, Local, Substâncias, EPI) — legíveis em P&B */
  .ra-chipgrid{gap:5px!important}
  .ra-chip{border:1px solid #888!important;background:#fff!important;color:#333!important;box-shadow:none!important;break-inside:avoid;padding:5px 10px!important}
  .ra-chip .box{border-color:#888!important;background:#fff!important}
  .ra-chip.on{background:#EAF6FC!important;border-color:var(--xd4)!important;font-weight:700!important}
  .ra-chip.on .box{background:var(--xd4)!important;border-color:var(--xd4)!important;color:#fff!important}
  .ra-chip:not(.on){opacity:.5}

  /* Perguntas Sim/Não/N-A */
  .ra-qa{break-inside:avoid;padding:7px 0!important}
  .ra-yn button{border:1px solid #999!important;background:#fff!important;color:#888!important;padding:4px 10px!important}
  .ra-yn button.sel-sim{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important;font-weight:700!important}
  .ra-yn button.sel-nao{background:var(--crit)!important;border-color:var(--crit)!important;color:#fff!important;font-weight:700!important}
  .ra-yn button.sel-na{background:var(--ink-3)!important;border-color:var(--ink-3)!important;color:#fff!important;font-weight:700!important}

  /* Medidor de risco e assinatura — preservam cor mesmo em P&B */
  .ra-risk{break-inside:avoid;border:1px solid #ccc}
  .ra-sig-pad{border:1px solid #999!important;background:#fff!important;height:80px!important}
  .lb-sig{border:1px solid #999!important}
  .ra-declare{border:1px solid #ddd!important;background:#fafafa!important}

  table.lb-table{break-inside:auto}
  table.lb-table tr{break-inside:avoid}
}

.diag-overlay.show{opacity:1;pointer-events:auto}

.diag-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.diag-head h4{font-size:14.5px;font-weight:700}
.diag-close{width:28px;height:28px;border-radius:8px;font-size:20px;color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.diag-close:hover{background:var(--sky);color:var(--ink)}
.diag-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--sky);flex-shrink:0}
.diag-tool{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-2);font-size:12.5px;font-weight:600}
.diag-tool svg{width:14px;height:14px}
.diag-tool:hover{border-color:var(--accent);color:var(--ink)}
.diag-tool.on{background:rgba(43,169,224,.12);border-color:var(--xd4);color:var(--ink)}
.diag-sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.diag-colors{display:flex;align-items:center;gap:6px}
.diag-color{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.diag-color.on{box-shadow:0 0 0 2px var(--ink)}
.diag-canvas-wrap{position:relative;background:repeating-conic-gradient(#f3f6fa 0% 25%,#fff 0% 50%) 0 0/18px 18px;overflow:hidden;flex:1;min-height:340px;max-height:56vh}
.diag-canvas-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.diag-hint{padding:8px 18px 0;font-size:11.5px;color:var(--ink-3);flex-shrink:0}
.diag-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;flex-shrink:0}
.diag-actions .left{display:flex;gap:8px}
.diag-btn{padding:9px 14px;border-radius:9px;font-size:12.5px;font-weight:600}
.diag-btn.ghost{background:var(--sky);color:var(--ink-2);border:1px solid var(--line)}
.diag-btn.ghost:hover{color:var(--ink);border-color:var(--accent)}
.diag-btn.primary{background:linear-gradient(135deg,var(--xd4),var(--blue));color:#fff;display:inline-flex;align-items:center;gap:7px}
.diag-btn.primary svg{width:14px;height:14px}

/* ================================================================
   ASSINATURA DIGITAL — pad de assinatura (dedo, caneta/stylus, mouse)
   Usado no Risk Assessment e nas rubricas do Diário de Bordo/Manutenção.
   ================================================================ */
const SIG_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
let SIG_CALLBACK=null, SIG_DRAWING=false, SIG_HASDRAWN=false, SIG_CTX=null, SIG_LAST=null;

function sigMark(val){
  // val pode ser: false/undefined (não assinado), true (dado legado sem imagem),
  // ou uma dataURL 'data:image/png;...' (assinatura real capturada no pad).
  if(!val) return '';
  if(typeof val==='string' && val.indexOf('data:image')===0) return `<img src="${val}" alt="assinatura" style="width:100%;height:100%;object-fit:contain">`;
  return SIG_CHECK;
}

function ensureSigModal(){
  if(document.getElementById('sigModalOverlay')) return;
  const div=document.createElement('div');
  div.id='sigModalOverlay';
  div.className='sig-modal-overlay';
  div.innerHTML=`
    <div class="sig-modal">
      <div class="sig-modal-head">
        <h4 id="sigModalTitle">Assinatura Digital</h4>
        <button class="sig-close" onclick="closeSignaturePad()" type="button" aria-label="Fechar">&times;</button>
      </div>
      <div class="sig-modal-hint">Assine com o dedo ou a caneta do tablet no espaço abaixo.</div>
      <div class="sig-canvas-wrap"><canvas id="sigCanvas"></canvas><div class="sig-baseline"></div></div>
      <div class="sig-modal-actions">
        <button class="sig-btn ghost" onclick="clearSignaturePad()" type="button">Limpar</button>
        <button class="sig-btn ghost" onclick="closeSignaturePad()" type="button">Cancelar</button>
        <button class="sig-btn primary" onclick="confirmSignaturePad()" type="button">${SIG_CHECK}Confirmar assinatura</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  setupSigCanvas();
  div.addEventListener('click', e=>{ if(e.target===div) closeSignaturePad(); });
}

function setupSigCanvas(){
  const canvas=document.getElementById('sigCanvas');
  const wrap=canvas.parentElement;
  function resize(){
    const rect=wrap.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    const prevData = canvas.width ? canvas.toDataURL('image/png') : null;
    canvas.width=Math.max(1,rect.width*dpr);
    canvas.height=Math.max(1,rect.height*dpr);
    canvas.style.width=rect.width+'px';
    canvas.style.height=rect.height+'px';
    const ctx=canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    ctx.lineWidth=2.6;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.strokeStyle=(getComputedStyle(document.documentElement).getPropertyValue('--ink')||'#1A2432').trim();
    SIG_CTX=ctx;
  }
  resize();
  window.addEventListener('resize', ()=>{
    const ov=document.getElementById('sigModalOverlay');
    if(ov && ov.classList.contains('show')) resize();
  });
  function pos(e){
    const rect=canvas.getBoundingClientRect();
    return {x:e.clientX-rect.left, y:e.clientY-rect.top};
  }
  canvas.addEventListener('pointerdown', e=>{
    e.preventDefault();
    try{ canvas.setPointerCapture(e.pointerId); }catch(_e){}
    SIG_DRAWING=true; SIG_HASDRAWN=true;
    SIG_LAST=pos(e);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!SIG_DRAWING) return;
    e.preventDefault();
    const p=pos(e);
    SIG_CTX.beginPath();
    SIG_CTX.moveTo(SIG_LAST.x,SIG_LAST.y);
    SIG_CTX.lineTo(p.x,p.y);
    SIG_CTX.stroke();
    SIG_LAST=p;
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>canvas.addEventListener(ev, ()=>{ SIG_DRAWING=false; }));
  canvas.style.touchAction='none';
}

/* title: texto do cabeçalho do modal · onConfirm: function(dataUrl) chamada ao confirmar */
function openSignaturePad(title, onConfirm){
  ensureSigModal();
  document.getElementById('sigModalTitle').textContent=title||'Assinatura Digital';
  clearSignaturePad();
  SIG_CALLBACK=onConfirm;
  document.getElementById('sigModalOverlay').classList.add('show');
}
function closeSignaturePad(){
  const o=document.getElementById('sigModalOverlay');
  if(o) o.classList.remove('show');
  SIG_CALLBACK=null;
}
function clearSignaturePad(){
  const canvas=document.getElementById('sigCanvas');
  if(!canvas||!SIG_CTX) return;
  const dpr=window.devicePixelRatio||1;
  SIG_CTX.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);
  SIG_HASDRAWN=false;
}
function confirmSignaturePad(){
  if(!SIG_HASDRAWN){ closeSignaturePad(); return; }
  const canvas=document.getElementById('sigCanvas');
  const dataUrl=canvas.toDataURL('image/png');
  const cb=SIG_CALLBACK;
  closeSignaturePad();

/* index by id + parent map for breadcrumbs */
const BYID={}, PARENT={};
(function idx(nodes,parent){ nodes.forEach(n=>{ BYID[n.id]=n; PARENT[n.id]=parent; if(n.children) idx(n.children,n); }); })(TREE,null);
function crumbTrail(id){ const t=[]; let n=BYID[id]; while(n){ t.unshift(n); n=PARENT[n.id]; } return t; }
function stripHTML(s){ return s.replace(/<[^>]+>/g,''); }

/* ---------- ÁRVORE ---------- */
const treeRoot=document.getElementById('treeRoot');
function buildTree(nodes,depth=0){
  const frag=document.createDocumentFragment();
  nodes.forEach(n=>{
    if(n.hidden) return; // indexado (roteável via ref) mas fora da árvore lateral
    const el=document.createElement('div');
    el.className='node'+(n.root?' root':'')+(n.children?'':'');
    if(n.pinned) el.classList.add('pinned');
    el.dataset.id=n.id;
    const hasKids=!!(n.children&&n.children.length)&&n.type!=='vehicle'&&!n.sidebarLeaf;
    const row=document.createElement('div'); row.className='node-row'; row.dataset.id=n.id;
    row.innerHTML=`
      <span class="caret ${hasKids?'':'leaf'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 6 15 12 9 18"/></svg></span>
      <span class="node-ic">${IC[n.icon]||IC.file}</span>
      <span class="node-lbl">${n.label}</span>
      ${n.badge?`<span class="node-badge">${n.badge}</span>`:''}
      <span class="node-st st-${n.status||'draft'}"></span>`;
    row.addEventListener('click',e=>{
      e.stopPropagation();
      const onCaret = e.target.closest('.caret');
      if(onCaret && hasKids){
        // clicar no caret apenas abre/fecha, sem navegar
        el.classList.toggle('open');
        return;
      }
      if(hasKids) el.classList.add('open'); // clicar no corpo abre e navega
      selectNode(n.id, true);
    });
    el.appendChild(row);
    if(hasKids){ const c=document.createElement('div'); c.className='children'; c.appendChild(buildTree(n.children,depth+1)); el.appendChild(c); }
    frag.appendChild(el);
  });
  return frag;
}
function renderTree(){ treeRoot.innerHTML=''; treeRoot.appendChild(buildTree(TREE)); }

function selectNode(id, fromRow){
  if(!BYID[id]) return;
  if(location.hash.slice(1)!==id){ location.hash=id; }
  else { activateNode(id); }
}
function activateNode(id){
  document.querySelectorAll('.node-row.active').forEach(r=>r.classList.remove('active'));
  const row=treeRoot.querySelector(`.node-row[data-id="${id}"]`);
  if(row){
    row.classList.add('active');
    // abre apenas os ANCESTRAIS para revelar o item, sem forçar o próprio nó
    const self=row.closest('.node');
    let p=self&&self.parentElement?self.parentElement.closest('.node'):null;
    while(p){ p.classList.add('open'); p=p.parentElement.closest('.node'); }
  }
  routeTo(id);
  if(window.innerWidth<=900) document.getElementById('tree').classList.remove('open');
}
window.addEventListener('hashchange',()=>{
  const id=location.hash.slice(1)||'home';
  if(BYID[id]) activateNode(id);
});
