/* ---------- HOME / DASHBOARD ---------- */
/* Fonte única de verdade para contagem de documentos: cada documento
   (ref) só é contado uma vez, mesmo se aparecer em mais de um lugar da
   Estrutura Documental (ex: MGO aparece no topo E dentro da família IT;
   a Fraseologia do Elios 3 aparece dentro do grupo de veículos E como
   item avulso). O card "Documentos" da home e o gráfico de rosca usam
   exatamente este mesmo cálculo, então nunca podem divergir. */
const FAM_COLORS=['var(--xd4)','var(--blue)','var(--accent)','var(--ok)'];
function docStats(){
  const seen=new Set();
  const overall={ok:0,warn:0,draft:0,crit:0,total:0};
  const claim=ref=>{
    if(!ref||seen.has(ref))return null;
    const n=BYID[ref]; if(!n)return null;
    seen.add(ref);
    overall.total++; overall[n.status]=(overall[n.status]||0)+1;
    return n;
  };
  let topN=0;
  ORG_DOCS.top.forEach(t=>{ if(claim(t.ref))topN++; });
  const perFamily=ORG_DOCS.families.map(f=>{
    let n=0;
    f.items.forEach(it=>{ if(claim(it.ref))n++; });
    (f.groups||[]).forEach(g=>g.items.forEach(it=>{ if(claim(it.ref))n++; }));
    return {code:f.code,title:f.title,n};
  });
  const slices=[{code:'GER',title:'Manuais Gerais',n:topN}, ...perFamily].filter(s=>s.n>0);
  overall.vehicles=Object.values(BYID).filter(n=>n.type==='vehicle').length;
  overall.families=ORG_DOCS.families.length;
  return {overall, slices};
}
function countStatus(){ return docStats().overall; }
function famCounts(){ return docStats().slices; }
function donutFamilies(){
  const {overall,slices}=docStats(); const total=overall.total||1;
  const R=54,C=2*Math.PI*R; let off=0,arcs='';
  slices.forEach((f,i)=>{ const len=C*f.n/total; arcs+=`<circle cx="65" cy="65" r="${R}" fill="none" stroke="${FAM_COLORS[i%FAM_COLORS.length]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 65 65)"/>`; off+=len; });
  return `<svg class="donut" viewBox="0 0 130 130"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--sky-line)" stroke-width="16"/>${arcs}<text x="65" y="61" text-anchor="middle" font-size="26" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono">${total}</text><text x="65" y="80" text-anchor="middle" font-size="10" fill="var(--ink-3)">documentos</text></svg>`;
}
function familyLegend(){ const fams=famCounts();
  return fams.map((f,i)=>`<div class="hl-row"><span class="d" style="background:${FAM_COLORS[i%FAM_COLORS.length]}"></span><span class="lbl">${f.title}</span><span class="v">${f.n}</span></div>`).join(''); }
function donut(c){
  const seg=[['ok',c.ok,'var(--ok)'],['warn',c.warn,'var(--warn)'],['draft',c.draft,'var(--draft)'],['crit',c.crit,'var(--crit)']].filter(s=>s[1]>0);
  const total=seg.reduce((a,s)=>a+s[1],0)||1; const R=54,C=2*Math.PI*R; let off=0; let arcs='';
  seg.forEach(s=>{ const len=C*s[1]/total; arcs+=`<circle cx="65" cy="65" r="${R}" fill="none" stroke="${s[2]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 65 65)"/>`; off+=len; });
  const pct=Math.round(100*c.ok/total);
  return `<svg class="donut" viewBox="0 0 130 130"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--sky-line)" stroke-width="16"/>${arcs}<text x="65" y="61" text-anchor="middle" font-size="26" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono">${pct}%</text><text x="65" y="80" text-anchor="middle" font-size="10" fill="var(--ink-3)">vigente</text></svg>`;
}
function fleetCards(){
  const vehicles=Object.values(BYID).filter(n=>n.type==='vehicle');

/* ---------- LEITOR: MGO ---------- */
/* ============================================================
   CARREGADOR DE CONTEÚDO EXTERNO (content/*.json)
   Cada POP/TOP/MGO vive em um arquivo JSON separado, gerado
   automaticamente a partir do .docx correspondente (ver
   /scripts/docx_to_json.py e o GitHub Action de conversão).
   Isso permite atualizar o conteúdo sem tocar neste HTML.
   ============================================================ */
const CONTENT_CACHE = {};

async function loadContent(key){
  if(CONTENT_CACHE[key]) return CONTENT_CACHE[key];
  // cache:'no-store' + parâmetro de versão evitam que o navegador ou a rede do
  // GitHub Pages sirvam uma cópia antiga do JSON depois de uma atualização.
  const res = await fetch(`content/${key}.json?v=${Date.now()}`, { cache: 'no-store' });
  if(!res.ok) throw new Error(`Não foi possível carregar content/${key}.json (HTTP ${res.status})`);
  const data = await res.json();
  CONTENT_CACHE[key] = data;
  return data;
}

function renderLoading(label){
  viewDoc.innerHTML = `
  <div class="doc">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--ink-3)">
      <div style="width:34px;height:34px;border:3px solid var(--sky-line);border-top-color:var(--xd4);border-radius:50%;animation:blueBookSpin .8s linear infinite;margin-bottom:16px"></div>
      <div style="font-size:13.5px">Carregando ${label}…</div>
    </div>
  </div>`;
}

function renderLoadError(key, label, err){
  viewDoc.innerHTML = `
  <div class="doc">
    <div class="callout crit" style="margin-top:24px">
      <div class="ci">⚠</div>
      <div>
        <b>Não foi possível carregar este documento</b>
        Falha ao buscar <code>content/${key}.json</code>. Se você abriu este arquivo diretamente
        (clique duplo, endereço começando com <code>file://</code>), isso é esperado: navegadores
        bloqueiam esse tipo de carregamento por segurança. Publique a pasta inteira (com a subpasta
        <code>content/</code>) em um servidor web ou no GitHub Pages para que ${label} carregue normalmente.
        <div style="margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:.75">${(err&&err.message)||err||''}</div>
      </div>
    </div>
  </div>`;
}

/* ---------- Renderizador genérico de documento (MGO/POP/TOP) ---------- */
async function renderDocFromKey(key, meta){
  renderLoading(meta.title);
  let content;
  try{
    content = await loadContent(key);
  }catch(err){
    renderLoadError(key, meta.title, err);
    console.error(err);
    return;
  }

  const idPrefix = meta.idPrefix || key;
  const chIndex = content.map(ch=>`<a onclick="scrollToSec('${idPrefix}-ch-${ch.num}')"><span class="n">${ch.num}.0</span><span class="tt">${titleCase(ch.title)}</span><span class="dots"></span></a>`).join('');
  let body = '';
  content.forEach(ch=>{
    body += `<h2 class="sec" id="${idPrefix}-ch-${ch.num}"><span class="sn">${ch.num}.0</span>${titleCase(ch.title)}</h2>`;
    ch.sections.forEach(s=>{
      const parts = s.num.split('.');
      if(parts.length>=2 && parts[1]!=='0'){
        body += `<h3 class="sub" id="${idPrefix}-sec-${s.num}"><span class="sn">${s.num}</span>${titleCase(s.title)}</h3>${s.html}`;
      } else if(s.html){ body += s.html; }
    });
  });

  viewDoc.innerHTML = `
  <div class="doc">
    ${crumbsHTML(meta.crumbId)}
    <div class="cover">
      <div class="doc-ic">${IC[meta.icon]||IC.file}</div>
      <h1>${meta.title}</h1>
      <div class="sub">${meta.subtitle}</div>
      <div class="tag">${meta.tag}</div>
    </div>
    <div class="ctrl">
      <div class="c"><div class="k">Código</div><div class="v mono"><span class="copy-code" onclick="copyCode('${meta.code}')">${meta.code}</span></div></div>
      <div class="c"><div class="k">Status</div><div class="v">Vigente</div></div>
      <div class="c"><div class="k">Responsável</div><div class="v">Diretor de Operações</div></div>
      <div class="c"><div class="k">Controle</div><div class="v">SGQ</div></div>
    </div>
    <div class="chapindex"><h4>Sumário</h4><div class="cols">${chIndex}</div></div>
    ${body}
    <div class="doc-foot">XD4Solutions · ${meta.footer} · Documento controlado pelo SGQ</div>
  </div>
  <nav class="spy" id="spy"></nav>`;
  buildSpy(); toggleSpy(true);
}

/* ============================================================
   INTEGRAÇÃO COM GOOGLE DRIVE / GOOGLE SHEETS
   Cole aqui a URL do seu Web App do Google Apps Script
   (veja instruções de configuração enviadas pela XD4Solutions).
   Enquanto estiver vazia ("" ), os diários salvam apenas
   localmente nesta sessão do navegador.
   ============================================================ */
const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbymY63xOk2kcp0e2Ci51oGmsEe8G-TsqFu-zp7XaMTSOpBo4U_-P_XC1-Ry13zHCXmxjw/exec";

async function sendToDrive(kind, payload, extra){
  if(!GAS_ENDPOINT){ return {ok:false, reason:'not_configured'}; }
  const fetchPromise = (async () => {
    const res = await fetch(GAS_ENDPOINT, {
      method:'POST',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita preflight OPTIONS, que o Apps Script não trata
      body: JSON.stringify(Object.assign({ kind, savedAt: new Date().toISOString(), payload }, extra||{}))
    });
    const text = await res.text();
    let json = null;
    try{ json = JSON.parse(text); }catch(_e){ /* resposta não era JSON */ }
    if(!res.ok){
      console.error('Google Drive respondeu com erro HTTP', res.status, text);
      return {ok:false, reason:'http_error', status:res.status, raw:text};
    }
    if(json && json.ok === false){
      console.error('Google Apps Script retornou erro:', json);
      return {ok:false, reason:'script_error', raw:json};
    }
    return {ok:true, data:json};
  })();

  // Mesmo se o timeout "vencer" a corrida abaixo, quando a resposta real do Google
  // chegar (em segundo plano) capturamos o link do PDF pra o botão de exportar funcionar.
  fetchPromise.then(realResult => {
    if(realResult && realResult.ok && realResult.data && realResult.data.pdfUrl){
      if(kind === 'diario_bordo') LAST_PDF_URL.diarios = realResult.data.pdfUrl;
      if(kind === 'diario_manutencao') LAST_PDF_URL['diarios-manut'] = realResult.data.pdfUrl;
      if(kind === 'risk_assessment') LAST_PDF_URL['risk-assessment'] = realResult.data.pdfUrl;
    }
  }).catch(()=>{ /* já tratado no caminho principal; aqui é só best-effort */ });

  // Timeout de segurança: a resposta do Apps Script às vezes fica "pendurada" no navegador
  // (redirecionamento do Google) mesmo já tendo sido processada do lado do servidor.
  // Sem isso, o painel nunca avisa nada — com isso, ele sempre responde em até 6s.
  const timeoutPromise = new Promise(resolve => {
    setTimeout(() => resolve({ok:true, reason:'timeout_assumed_ok', data:null}), 6000);
  });

  try{
    return await Promise.race([fetchPromise, timeoutPromise]);
  }catch(e){
    console.error('Falha de rede ao enviar para o Google Drive:', e);
    return {ok:false, reason:'network_error', error:String(e)};
  }
}

function lbMinDiff(a,b){
  if(!a||!b) return null;
  const [ah,am]=a.split(':').map(Number), [bh,bm]=b.split(':').map(Number);
  if(isNaN(ah)||isNaN(bh)) return null;
  let d=(bh*60+bm)-(ah*60+am);
  if(d<0) d+=24*60;
  return d;
}
function lbFmt(mins){ if(mins==null) return '--:--'; const h=Math.floor(mins/60), m=mins%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

function lbRenderVoos(){
  const body = document.getElementById('lbVoosBody');
  if(!body) return;
  let acum = 0;
  body.innerHTML = LB_STATE.voos.map((v,i)=>{
    const tempo = lbMinDiff(v.partida, v.corte);
    acum += (tempo||0);
    const opts = CODIGO_VOO_OPTS.map(([c,l])=>`<option value="${c}" ${v.codigo===c?'selected':''}>${c}</option>`).join('');
    return `<tr>
      <td><input value="${v.etapa}" onchange="lbSet(${i},'etapa',this.value)"></td>
      <td class="lb-local"><input value="${v.local}" onchange="lbSet(${i},'local',this.value)"></td>

      <td><input type="time" value="${v.corte}" onchange="lbSet(${i},'corte',this.value)"></td>

      <td><input readonly value="${lbFmt(acum)}"></td>
      <td><input value="${v.bateria}" onchange="lbSet(${i},'bateria',this.value)"></td>
      <td><input value="${v.ciclo}" onchange="lbSet(${i},'ciclo',this.value)" style="text-align:center"></td>
      <td><select onchange="lbSet(${i},'codigo',this.value)">${opts}</select></td>
      <td><div class="lb-sig ${v.rubrica?'on':''}" onclick="lbOpenRubricaSig(${i})">${sigMark(v.rubrica)}</div></td>
      <td><div class="lb-rowdel" onclick="lbDelVoo(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg></div></td>
    </tr>`;
  }).join('');
  document.getElementById('lbTotVoos').textContent = LB_STATE.voos.length;
  document.getElementById('lbTotTempo').textContent = lbFmt(acum);
  document.getElementById('lbTotCiclos').textContent = LB_STATE.voos.reduce((s,v)=>s+(Number(v.ciclo)||0),0);

  lbMarkDirty();
}

  document.getElementById('lbStatusText').textContent = 'Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const rel = lbBuildReport();
  const pdfBlob = await gerarPdfBlob(rel.headHtml, rel.bodyHtml);
  const extra = pdfBlob ? { pdfBase64: await blobToBase64(pdfBlob), nomeArquivoSugerido: rel.filename } : undefined;
  if(!pdfBlob){ console.warn('PDF idêntico não pôde ser gerado no navegador; o Drive vai usar o layout padrão do Google Docs como alternativa.'); }

  const r = await sendToDrive('diario_bordo', LB_STATE, extra);
  if(r.reason==='timeout_assumed_ok'){
    lbToast('Diário enviado ao Google Drive (envio confirmado; aguardando resposta de detalhes)');

    lbToast('Diário salvo e enviado ao Google Drive');
    if(r.data && r.data.pdfUrl){ LAST_PDF_URL.diarios = r.data.pdfUrl; }

}

      <td><input value="${d.etapa}" onchange="mtSetDisc(${i},'etapa',this.value)"></td>

      <td class="lb-local"><input value="${d.descInter}" onchange="mtSetDisc(${i},'descInter',this.value)"></td>
      <td><div class="lb-sig ${d.rub1?'on':''}" onclick="mtOpenDiscSig(${i},'rub1')">${sigMark(d.rub1)}</div></td>
      <td><input value="${d.etapaAcao}" onchange="mtSetDisc(${i},'etapaAcao',this.value)"></td>
      <td class="lb-local"><input value="${d.descAcao}" onchange="mtSetDisc(${i},'descAcao',this.value)"></td>
      <td><div class="lb-sig ${d.rub2?'on':''}" onclick="mtOpenDiscSig(${i},'rub2')">${sigMark(d.rub2)}</div></td>
      <td><div class="lb-rowdel" onclick="mtDelDisc(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg></div></td>
    </tr>`).join('') || `<tr><td colspan="8" style="color:var(--ink-3);padding:14px">Nenhuma discrepância registrada.</td></tr>`;
  mtMarkDirty();
}
function mtSetDisc(i,field,val){ MT_STATE.discrepancias[i][field]=val; mtMarkDirty(); }
function mtOpenDiscSig(i,field){
  const d=MT_STATE.discrepancias[i];
  const label = field==='rub1' ? 'Rubrica — Discrepância' : 'Rubrica — Ação Corretiva';
  openSignaturePad(label+' ('+(d.etapa||('#'+(i+1)))+')', dataUrl=>{
    MT_STATE.discrepancias[i][field]=dataUrl;
    mtRenderDisc();
  });
}
function mtDelDisc(i){ MT_STATE.discrepancias.splice(i,1); mtRenderDisc(); }
function mtAddDisc(){ MT_STATE.discrepancias.push({etapa:'',descDisc:'',descInter:'',rub1:false,etapaAcao:'',descAcao:'',rub2:false}); mtRenderDisc(); }

function mtOpenRespSig(){

function mtMarkDirty(){
  const s = document.getElementById('mtStatus');
  if(s && s.classList.contains('saved')){ s.classList.remove('saved'); document.getElementById('mtStatusText').textContent='Rascunho não salvo'; }
}
function mtToast(msg){
  const t = document.getElementById('mtToast');
  document.getElementById('mtToastText').textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), msg.length>60 ? 7000 : 3200);
}
function mtGatherFields(){
  ['mtNumSerie','mtOperador','mtNumDoc','mtRevisao','mtHoras','mtRespNome','mtRespData','mtInspecao'].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    if(id==='mtNumSerie') MT_STATE.numSerie = el.value;
    if(id==='mtOperador') MT_STATE.operador = el.value;
    if(id==='mtNumDoc') MT_STATE.numDoc = el.value;
    if(id==='mtRevisao') MT_STATE.revisao = el.value;
    if(id==='mtHoras') MT_STATE.horasManutencao = el.value;
    if(id==='mtRespNome') MT_STATE.respNome = el.value;
    if(id==='mtRespData') MT_STATE.respData = el.value;
    if(id==='mtInspecao') MT_STATE.inspecao = el.value;
  });
}
async function mtSave(){
  mtGatherFields();
  const s = document.getElementById('mtStatus');
  s.classList.add('saved');
  document.getElementById('mtStatusText').textContent = 'Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const rel = mtBuildReport();
  const pdfBlob = await gerarPdfBlob(rel.headHtml, rel.bodyHtml);
  const extra = pdfBlob ? { pdfBase64: await blobToBase64(pdfBlob), nomeArquivoSugerido: rel.filename } : undefined;
  if(!pdfBlob){ console.warn('PDF idêntico não pôde ser gerado no navegador; o Drive vai usar o layout padrão do Google Docs como alternativa.'); }

  const r = await sendToDrive('diario_manutencao', MT_STATE, extra);
  if(r.reason==='timeout_assumed_ok'){
    mtToast('Diário enviado ao Google Drive (envio confirmado; aguardando resposta de detalhes)');
  } else if(r.ok){
    mtToast('Diário salvo e enviado ao Google Drive');
    if(r.data && r.data.pdfUrl){ LAST_PDF_URL['diarios-manut'] = r.data.pdfUrl; }
  }
  else if(r.reason==='not_configured'){ mtToast('Diário salvo localmente (Google Drive não configurado)'); }
  else { console.error('Detalhe do erro de envio:', r); mtToast('Falha ao enviar ao Drive: '+(r.reason||'erro desconhecido')+'. Veja o console (F12) para detalhes.'); }
}

    ${item.icon?`<span class="ic">${IC[item.icon]||IC.file}</span>`:''}
    <span class="lbl">${item.label}</span>
  </div>${checked?qual:''}`;
}
function raOutrosChipHTML(group, checked, val, hazardStyle){

function raToggleChip(group, key){
  RA_STATE[group][key] = !RA_STATE[group][key];
  if(group==='equip') raRenderEquip();
  else if(group==='local') raRenderLocal();
  else if(group==='subst') raRenderSubst();
  else if(group==='epi') raRenderEpi();
  raUpdateRiskMeter();
  raMarkDirty();
}
function raSetQual(group, key, val){
  RA_STATE[group][key] = val;
  raMarkDirty();
}
function raSetChoice(group, i, val){
  RA_STATE[group][i] = (RA_STATE[group][i]===val) ? '' : val;
  if(group==='aspectos') raRenderAspectos(); else raRenderRecuperacao();
  raUpdateRiskMeter();
  raMarkDirty();
}
function raSyncField(field, val){ RA_STATE[field] = val; raUpdateTailstrip(); raMarkDirty(); }
function raToggleAgree(){
  RA_STATE.agree = !RA_STATE.agree;
  document.getElementById('raAgree').classList.toggle('on', RA_STATE.agree);
  raMarkDirty();
}
function raRenderSigPad(){
  const pad=document.getElementById('raSigPad'); if(!pad) return;
  if(RA_STATE.assinaturaImg){
    pad.classList.add('signed');
    pad.innerHTML=`<img src="${RA_STATE.assinaturaImg}" alt="assinatura">`;

    pad.classList.remove('signed');

  }
}
function raOpenSig(){

/* ================================================================
   EXPORTAÇÃO — Relatório PDF do Risk Assessment
   Gerado 100% no navegador (não depende do Apps Script/Drive), para
   garantir que o layout e o conteúdo exportados são sempre os corretos.
   ================================================================ */
function raEsc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function raChecklistBlock(title, items, stateObj){
  const rows = items.map(it=>{
    const on = !!stateObj[it.key];
    const qual = (it.qual && on && stateObj[it.key+'Qual']) ? ` <span class="rp-qual">(${raEsc(stateObj[it.key+'Qual'])})</span>` : '';
    return `<div class="rp-check ${on?'on':''}"><span class="mark">${on?'&#10003;':''}</span>${raEsc(it.label)}${qual}</div>`;
  }).join('');
  const outros = stateObj.outros ? `<div class="rp-check on"><span class="mark">&#10003;</span>Outros${stateObj.outrosDesc?': '+raEsc(stateObj.outrosDesc):''}</div>` : '';
  return `<div class="rp-section"><h3>${raEsc(title)}</h3><div class="rp-checkgrid">${rows}${outros}</div></div>`;
}

function raYnBlock(title, questions, values){
  const rows = questions.map((q,i)=>{
    const v = values[i];
    const label = v==='sim'?'SIM':v==='nao'?'NÃO':v==='na'?'N/A':'—';
    const cls = v==='sim'?'sim':v==='nao'?'nao':v==='na'?'na':'blank';
    return `<tr><td class="rp-qnum">${String(i+1).padStart(2,'0')}</td><td>${raEsc(q)}</td><td><span class="rp-pill ${cls}">${label}</span></td></tr>`;
  }).join('');
  return `<div class="rp-section"><h3>${raEsc(title)}</h3><table class="rp-table"><tbody>${rows}</tbody></table></div>`;
}

/* ================================================================
   PDF IDÊNTICO NO DRIVE — gera o PDF no próprio navegador (html2pdf.js),
   a partir do MESMO HTML da pré-visualização, e envia pronto pro Drive.
   Assim o Apps Script só salva os bytes, sem precisar "redesenhar" nada
   no Google Docs — o resultado é visualmente idêntico ao exportado aqui.
   ================================================================ */
let HTML2PDF_LOADING = null;
function ensureHtml2Pdf(){
  if(window.html2pdf) return Promise.resolve();
  if(HTML2PDF_LOADING) return HTML2PDF_LOADING;
  HTML2PDF_LOADING = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Falha ao carregar html2pdf.js'));
    document.head.appendChild(s);
  });
  return HTML2PDF_LOADING;
}
function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=>{ resolve(String(reader.result).split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
/* Renderiza headHtml+bodyHtml (o mesmo conteúdo usado na pré-visualização) num
   container fora da tela e converte em PDF. Retorna um Blob de PDF, ou null
   se falhar (nesse caso quem chamou deve seguir sem pdfBase64, como fallback). */
async function gerarPdfBlob(headHtml, bodyHtml){
  try{ await ensureHtml2Pdf(); }catch(e){ console.error('html2pdf.js não carregou:', e); return null; }

  // Importante: deixar left:0 (só sobe pra fora da tela verticalmente) — um left
  // muito negativo bagunça a medição de largura do html2canvas e corta o conteúdo.
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:0;top:-10000px;width:210mm;background:#fff;z-index:-1';
  holder.innerHTML = `<style>${rpStyles()}</style><div class="rp-page" style="margin:0;box-shadow:none;border-radius:0">${headHtml}${bodyHtml}</div>`;
  document.body.appendChild(holder);

  try{
    const el = holder.querySelector('.rp-page');
    const opt = {
      margin: 0,
      image: { type:'jpeg', quality:0.95 },
      html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak: { mode:'css' }
    };
    const blob = await window.html2pdf().set(opt).from(el).outputPdf('blob');
    return blob;
  }catch(e){
    console.error('Falha ao gerar PDF com html2pdf.js:', e);
    return null;
  }finally{
    document.body.removeChild(holder);
  }
}

function raComputeRisk(){
  const hazardCount = RA_LOCAL_ITEMS.filter(it=>RA_STATE.local[it.key]).length
    + (RA_STATE.local.outros?1:0)
    + RA_SUBST_ITEMS.filter(it=>RA_STATE.subst[it.key]).length
    + (RA_STATE.subst.outros?1:0);
  const gapCount = RA_STATE.aspectos.filter(v=>v==='nao').length;
  const score = Math.min(100, hazardCount*10 + gapCount*15);
  let level='low', label='Baixo', color='#1E7B4F', bg='#E7F4EC';
  if(score>=50){ level='high'; label='Alto'; color='#B42318'; bg='#FBEAE8'; }
  else if(score>=20){ level='med'; label='Médio'; color='#B5820A'; bg='#FBF3DE'; }
  return {score,level,label,color,bg,hazardCount,gapCount};
}
function raUpdateRiskMeter(){
  const r = raComputeRisk();
  const cssColor = r.level==='high' ? 'var(--crit)' : r.level==='med' ? 'var(--warn)' : 'var(--ok)';
  const boxEl=document.getElementById('raRiskBox');
  if(boxEl) boxEl.className = 'ra-risk '+r.level;
  const scoreEl=document.getElementById('raRiskScore'); if(scoreEl) scoreEl.textContent = r.score;
  const levelEl=document.getElementById('raRiskLevel'); if(levelEl) levelEl.textContent = r.label;
  const fillEl=document.getElementById('raRiskFill'); if(fillEl){ fillEl.style.width = r.score+'%'; fillEl.style.background = cssColor; }
}
function raMarkDirty(){

}
function raToast(msg){
  const t = document.getElementById('raToast'); if(!t) return;
  document.getElementById('raToastText').textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), msg.length>60 ? 7000 : 3200);

async function raSave(){
  const s = document.getElementById('raStatus');
  s.classList.add('saved');
  document.getElementById('raStatusText').textContent = 'Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const rel = raBuildReport();
  const pdfBlob = await gerarPdfBlob(rel.headHtml, rel.bodyHtml);
  const extra = pdfBlob ? { pdfBase64: await blobToBase64(pdfBlob), nomeArquivoSugerido: rel.filename } : undefined;
  if(!pdfBlob){ console.warn('PDF idêntico não pôde ser gerado no navegador; o Drive vai usar o layout padrão do Google Docs como alternativa.'); }

  const r = await sendToDrive('risk_assessment', RA_STATE, extra);
  if(r.reason==='timeout_assumed_ok'){
    raToast('Risk Assessment enviado ao Google Drive (envio confirmado; aguardando resposta de detalhes)');
  } else if(r.ok){
    raToast('Risk Assessment salvo e enviado ao Google Drive');
    if(r.data && r.data.pdfUrl){ LAST_PDF_URL['risk-assessment'] = r.data.pdfUrl; }
  }
  else if(r.reason==='not_configured'){ raToast('Risk Assessment salvo localmente (Google Drive não configurado)'); }
  else { console.error('Detalhe do erro de envio:', r); raToast('Falha ao enviar ao Drive: '+(r.reason||'erro desconhecido')+'. Veja o console (F12) para detalhes.'); }
}

function titleCase(s){
  if(s===s.toUpperCase()){ s=s.toLowerCase(); }
  // Capitaliza a 1a letra de cada palavra (respeita / e -), mantém siglas conhecidas
  const KEEP={mgo:'MGO',mgm:'MGM',pop:'POP',top:'TOP',ceo:'CEO',coo:'COO',cco:'CCO',epi:'EPI',anac:'ANAC',decea:'DECEA',anatel:'ANATEL',rpa:'RPA',rpas:'RPAS',uas:'UAS',nr:'NR',sgq:'SGQ',xd4solutions:'XD4Solutions',ica:'ICA',cenipa:'CENIPA',ppra:'PPRA',pcmso:'PCMSO'};
  return s.replace(/[\p{L}][\p{L}0-9]*/gu, w=>{
    const low=w.toLowerCase();
    if(KEEP[low]) return KEEP[low];
    return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  });
}

    const body = allProcess
      ? `<div class="proc-grid">${kids.map(procCard).join('')}</div>`
      : `<div class="asset-grid2">${kids.map(assetCard2).join('')}</div>`;
    viewDoc.innerHTML=`

      <div class="grp2-head">

/* ---------- MANUAIS (content/manuals/*.pdf vindos do repositório GitHub) ----------
   Mesma lógica do content/*.json: os PDFs ficam versionados na pasta manuals/
   deste mesmo repositório/GitHub Pages. Basta subir o arquivo com o nome indicado
   no campo "file" de cada nó (ver TREE) que ele passa a abrir aqui automaticamente
   — nada precisa ser alterado neste HTML. */
async function fileExists(url){
  try{
    const res = await fetch(`${url}?v=${Date.now()}`, { method:'HEAD', cache:'no-store' });
    return res.ok;
  }catch(_e){ return false; }
}
async function renderManual(n){
  if(n.external) return renderManualExternal(n);
  const files = n.files||[];
  viewDoc.innerHTML=`
  <div class="ph">
    ${crumbsHTML(n.id)}
    <div class="ph-head">
      <div class="ph-ic">${IC.pdf}</div>
      <h1>${stripHTML(n.label)}</h1>
      <div class="code">Manual do Fabricante · PDF</div>
      <div class="ph-status" id="manualStatus"><span class="d"></span>Verificando arquivo(s)…</div>
    </div>
    <div class="ph-note">Manuais técnicos originais do fabricante, versionados junto com este site no repositório GitHub (pasta <code>manuals/</code>).</div>
    <div class="manual-panel">
      <div class="manual-tab">Standard</div>
      <div class="manual-list" id="manualList"></div>
    </div>
  </div>`;

  const listEl = document.getElementById('manualList');
  const statusEl = document.getElementById('manualStatus');
  if(!files.length){
    statusEl.innerHTML = '<span class="d"></span>Nenhum arquivo cadastrado';
    listEl.innerHTML = '<div style="padding:24px;color:var(--ink-3);font-size:13.5px">Nenhum manual cadastrado ainda.</div>';
    return;
  }

  const results = await Promise.all(files.map(async f=>({ ...f, ok: await fileExists(f.file) })));
  const okCount = results.filter(r=>r.ok).length;

  if(okCount===results.length){
    statusEl.style.background='var(--ok-bg)'; statusEl.style.color='var(--ok)';
    statusEl.innerHTML='<span class="d" style="background:var(--ok)"></span>Disponível';
  } else if(okCount===0){
    statusEl.style.background='var(--crit-bg)'; statusEl.style.color='var(--crit)';
    statusEl.innerHTML='<span class="d" style="background:var(--crit)"></span>Arquivo não encontrado';
  } else {
    statusEl.style.background='var(--warn-bg)'; statusEl.style.color='var(--warn)';
    statusEl.innerHTML='<span class="d" style="background:var(--warn)"></span>Parcialmente disponível';
  }

  listEl.innerHTML = results.map(f=>{
    const sizeTag = f.size?`<span class="mr-size">${f.size}</span>`:'';
    if(f.ok){
      return `
      <a class="manual-row" href="${f.file}" target="_blank" rel="noopener">
        <div class="mr-ic">${IC.pdf}${sizeTag}</div>
        <div class="mr-info"><div class="mr-name">${f.label}</div><div class="mr-type">PDF</div></div>
        <div class="mr-open">Abrir ↗</div>
      </a>`;
    }
    return `
      <div class="manual-row missing" title="Suba o arquivo em ${f.file} no repositório GitHub">
        <div class="mr-ic warn">${IC.pdf}</div>
        <div class="mr-info"><div class="mr-name">${f.label}</div><div class="mr-type">Ainda não enviado · <code>${f.file}</code></div></div>
        <div class="mr-open warn">Pendente</div>
      </div>`;
  }).join('');
}

const cmdkOverlay=document.getElementById('cmdkOverlay');
const cmdkInput=document.getElementById('cmdkInput');
const cmdkResults=document.getElementById('cmdkResults');
let cmdkSel=0, cmdkList=[];
function searchable(){ return Object.values(BYID).filter(n=>n.type!=='group'); }
function openCmdk(){ cmdkOverlay.classList.add('show'); cmdkInput.value=''; renderCmdk(''); cmdkInput.focus(); }
function closeCmdk(){ cmdkOverlay.classList.remove('show'); }
window.openCmdk=openCmdk;
function renderCmdk(q){
  q=q.toLowerCase();
  cmdkList=searchable().filter(n=>{ const hay=(stripHTML(n.label)+' '+(n.code||'')+' '+(n.badge||'')).toLowerCase(); return !q||hay.includes(q); }).slice(0,8);
  cmdkSel=0;
  if(!cmdkList.length){ cmdkResults.innerHTML='<div class="cmdk-empty">Nada encontrado.</div>'; return; }
  cmdkResults.innerHTML=cmdkList.map((n,i)=>`<div class="cmdk-item ${i===0?'sel':''}" data-i="${i}" onclick="cmdkGo(${i})"><div class="ci">${IC[n.icon]||IC.file}</div><div class="cl">${stripHTML(n.label)}<small>${n.code||stName[n.status]||''}</small></div>${n.code?`<span class="ck">${n.code}</span>`:''}</div>`).join('');
}
function cmdkGo(i){ const n=cmdkList[i]; if(n){ closeCmdk(); selectNode(n.id); } }
window.cmdkGo=cmdkGo;
cmdkInput.addEventListener('input',e=>renderCmdk(e.target.value));
cmdkInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();cmdkSel=Math.min(cmdkSel+1,cmdkList.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdkSel=Math.max(cmdkSel-1,0);}
  else if(e.key==='Enter'){e.preventDefault();cmdkGo(cmdkSel);return;}
  else return;
  cmdkResults.querySelectorAll('.cmdk-item').forEach((el,i)=>el.classList.toggle('sel',i===cmdkSel));
});
cmdkOverlay.addEventListener('click',e=>{ if(e.target===cmdkOverlay) closeCmdk(); });
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openCmdk(); }
  else if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); openCmdk(); }
  else if(e.key==='Escape'){ closeCmdk(); }
});

/* ---------- ASSISTENTE DE IA (chat ligado à API do RAG) ---------- */
// Endereço da API construída em Python (FastAPI). Enquanto você testa
// no seu próprio PC, é localhost. Quando hospedar a API num serviço
// como Render/Railway, troque esta linha pela URL pública dela.
const CHAT_API_URL = 'https://rag-blue-book-api.onrender.com/ask';

function escapeHtml(str){
  const d=document.createElement('div');
  d.textContent=str;
  return d.innerHTML;
}

function renderChatView(){
  viewChat.innerHTML = `
    <div class="chat-wrap">
      <div class="chat-head">
        <div class="chat-head-ic">${IC.book}</div>
        <div>
          <h1>Assistente de Documentação</h1>
          <p>Pergunte sobre MGO, POP, TOP e manuais técnicos. As respostas usam somente o conteúdo oficial já cadastrado.</p>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">Faça uma pergunta para começar — ex: "Qual a autonomia de voo do Elios 3?"</div>
      </div>
      <form class="chat-form" id="chatForm">
        <input id="chatInput" placeholder="Digite sua pergunta…" autocomplete="off">
        <button type="submit" class="chat-send" id="chatSend">Enviar</button>
      </form>
      <p class="chat-hint">Conectado a: <code>${escapeHtml(CHAT_API_URL)}</code></p>
    </div>`;
  document.getElementById('chatForm').addEventListener('submit', handleChatSubmit);
  document.getElementById('chatInput').focus();
}

function appendChatMessage(role, text, sources, isError){
  const wrap=document.getElementById('chatMessages');
  const empty=wrap.querySelector('.chat-empty');
  if(empty) empty.remove();
  const div=document.createElement('div');
  div.className='chat-msg '+role;
  let sourcesHtml='';
  if(sources && sources.length){
    sourcesHtml=`<details class="chat-sources"><summary>Fontes utilizadas (${sources.length})</summary><ul>${sources.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ul></details>`;
  }
  div.innerHTML=`<div class="chat-bubble${isError?' err':''}">${escapeHtml(text).replace(/\n/g,'<br>')}${sourcesHtml}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop=wrap.scrollHeight;
  return div;
}

function appendChatLoading(){
  const wrap=document.getElementById('chatMessages');
  const div=document.createElement('div');
  div.className='chat-msg assistant';
  div.innerHTML=`<div class="chat-bubble loading"><span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span></div>`;
  wrap.appendChild(div);
  wrap.scrollTop=wrap.scrollHeight;
  return div;
}

async function handleChatSubmit(e){
  e.preventDefault();
  const input=document.getElementById('chatInput');
  const question=input.value.trim();
  if(!question) return;
  appendChatMessage('user', question);
  input.value='';
  const sendBtn=document.getElementById('chatSend');
  sendBtn.disabled=true;
  const loadingEl=appendChatLoading();
  try{
    const res=await fetch(CHAT_API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question})
    });
    if(!res.ok){
      const err=await res.json().catch(()=>({detail:'Erro desconhecido'}));
      throw new Error(err.detail||'Erro ao consultar a API.');
    }
    const data=await res.json();
    loadingEl.remove();
    appendChatMessage('assistant', data.answer, data.sources);
  }catch(err){
    loadingEl.remove();
    appendChatMessage('assistant', `Não consegui falar com o assistente. Confirme se a API está rodando (${CHAT_API_URL}). Detalhe: ${err.message}`, [], true);
  }finally{
    sendBtn.disabled=false;
    input.focus();
  }
}

  function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
  function setPath(obj, path, val){
    const parts=path.split('.'); let o=obj;
    for(let i=0;i<parts.length-1;i++){ o=o[parts[i]]; }
    o[parts[parts.length-1]]=val;
  }
  function deepMerge(base, extra){
    if(Array.isArray(base)) return extra!==undefined ? extra : base;
    if(typeof base==='object' && base!==null){
      const out=Object.assign({}, base);
      if(extra && typeof extra==='object'){
        Object.keys(base).forEach(k=>{ out[k]=deepMerge(base[k], extra[k]); });
      }
      return out;
    }
    return extra!==undefined ? extra : base;
  }

  /* Garante que STATE.etapas seja sempre um array válido, mesmo vindo de
     um rascunho salvo em formato antigo. */
  function normalizeEtapas(etapas){
    if(Array.isArray(etapas) && etapas.length){
      return etapas.map((e,i)=>({
        id: (e && e.id) ? e.id : 'e'+(i+1),
        titulo: (e && e.titulo) ? e.titulo : (ETAPAS_PADRAO[i] ? ETAPAS_PADRAO[i].titulo : ('Etapa '+(i+1))),
        desc: (e && e.desc!==undefined) ? e.desc : (ETAPAS_PADRAO[i] ? ETAPAS_PADRAO[i].desc : ''),
        img: (e && e.img) ? e.img : null
      }));
    }
    return ETAPAS_PADRAO.map((d,i)=>{
      const key='e'+(i+1);
      const old = (etapas && typeof etapas==='object') ? etapas[key] : null;
      return { id:key, titulo:d.titulo, desc:(old && old.desc!==undefined) ? old.desc : d.desc, img:(old && old.img) ? old.img : null };
    });
  }

  /* ---------- entry point (chamado pelo router) ---------- */
  function renderPlanoCaptura(n){
    CURRENT_NODE = n;
    let saved=null;
    try{ const raw=localStorage.getItem(STORAGE_KEY); if(raw) saved=JSON.parse(raw); }catch(e){}
    STATE = saved ? deepMerge(defaultState(), saved) : defaultState();
    STATE.etapas = normalizeEtapas(STATE.etapas);

    viewDoc.innerHTML = templatePlanoCaptura(n);

    bindSimpleFields();
    renderEquip();
    renderZone('localidade', document.getElementById('pcZoneLocalidade'), STATE.localidadeImg, v=>{STATE.localidadeImg=v;});
    renderGallery();
    renderEtapas();
    renderAgree();
    updateTailstrip();
    updateTitle();
    renderApproval();
    updateProgress();
    markStatus(!!STATE.savedAt);

    document.getElementById('pcContAgree').addEventListener('click', ()=>{
      STATE.contingencia.agree=!STATE.contingencia.agree; renderAgree(); markDirty(); updateProgress();
    });
    document.getElementById('pcFaseSelect').addEventListener('change', ()=>{
      if(STATE.escopo.fase==='final'){
        if(!STATE.aprovacao || !STATE.aprovacao.aprovado) STATE.aprovacao={aprovado:true, data:new Date().toISOString()};
      } else {
        STATE.aprovacao={aprovado:false, data:null};
      }
      updateTailstrip(); updateTitle(); renderApproval();
    });

    const diagBgInput=document.getElementById('pcDiagBgInput');
    if(diagBgInput){
      diagBgInput.addEventListener('change', ev=>{
        const f=ev.target.files[0]; if(!f) return;
        const r=new FileReader();
        r.onload=()=>{
          const img=new Image();
          img.onload=()=>{
            const rect=diagCanvas.getBoundingClientRect();
            const cw=rect.width, ch=rect.height;
            const scale=Math.min(cw/img.width, ch/img.height);
            const dw=img.width*scale, dh=img.height*scale;
            const dx=(cw-dw)/2, dy=(ch-dh)/2;
            diagCtx.fillStyle='#ffffff'; diagCtx.fillRect(0,0,cw,ch);
            diagCtx.drawImage(img, dx,dy,dw,dh);
            pushDiagHist();
          };
          img.src=r.result;
        };
        r.readAsDataURL(f);
        diagBgInput.value='';
      });
    }
  }

  function bindSimpleFields(){
    document.querySelectorAll('#viewDoc [data-path]').forEach(el=>{
      const val=getPath(STATE, el.dataset.path);
      el.value = (val===undefined || val===null) ? '' : val;
      el.addEventListener('input', ()=>{
        setPath(STATE, el.dataset.path, el.value);
        markDirty(); updateTailstrip(); updateProgress();
      });
    });
  }

  function markDirty(){ DIRTY=true; markStatus(false); }
  function markStatus(saved){
    const box=document.getElementById('pcStatus');
    const txt=document.getElementById('pcStatusText');
    if(!box || !txt) return;
    if(saved){ box.classList.add('saved'); txt.textContent='Salvo neste navegador'; }
    else { box.classList.remove('saved'); txt.textContent='Rascunho não salvo'; }
  }

  function updateTailstrip(){
    const e1=document.getElementById('pcTailEmpresa'); if(!e1) return;
    e1.textContent = STATE.meta.empresa || '—';
    document.getElementById('pcTailEstrutura').textContent = STATE.meta.estrutura || '—';
    document.getElementById('pcTailData').textContent = STATE.meta.data || '—';
    const eq=[]; if(STATE.equip.elios3) eq.push('Elios 3'); if(STATE.equip.elios2) eq.push('Elios 2'); if(STATE.equip.go2) eq.push('GO2'+(STATE.equip.go2Variante?' ('+STATE.equip.go2Variante+')':'')); if(STATE.equip.g1) eq.push('G1'); if(STATE.equip.rover) eq.push('Rover');
    document.getElementById('pcTailEquip').textContent = eq.length? eq.join(', ') : '—';
    document.getElementById('pcFaseChip').innerHTML = 'FASE <b>'+(STATE.escopo.fase==='final'?'FINAL':'PRELIMINAR')+'</b>';
  }

  function updateTitle(){
    const el=document.getElementById('pcMainTitle'); if(!el) return;
    const label = STATE.escopo.fase==='final' ? 'Final' : 'Preliminar';
    el.textContent = 'Plano de Captura ' + label;
  }

  /* ---------- aprovação do plano (preliminar -> final) ---------- */
  function approvePlan(){
    if(STATE.escopo.fase==='final'){
      if(!confirm('Reverter este plano para a fase "Preliminar"? Isso desfaz a aprovação como Final.')) return;
      STATE.escopo.fase='preliminar';
      STATE.aprovacao={aprovado:false, data:null};
    } else {
      if(!confirm('Confirma a aprovação deste Plano de Captura como FINAL, após a visualização do ativo em campo?\n\nA fase será alterada de "Preliminar" para "Final".')) return;
      STATE.escopo.fase='final';
      STATE.aprovacao={aprovado:true, data:new Date().toISOString()};
    }
    document.getElementById('pcFaseSelect').value = STATE.escopo.fase;
    updateTailstrip();
    updateTitle();
    renderApproval();
    markDirty();
    updateProgress();
  }

  function renderApproval(){
    const btn=document.getElementById('pcBtnAprovar');
    const badge=document.getElementById('pcAprovBadge');
    if(!btn || !badge) return;
    const isFinal = STATE.escopo.fase==='final';
    btn.textContent = isFinal ? 'Reverter para Preliminar' : 'Aprovar Plano como Final';
    btn.classList.toggle('is-final', isFinal);
    if(STATE.aprovacao && STATE.aprovacao.aprovado){
      const d = STATE.aprovacao.data ? new Date(STATE.aprovacao.data) : null;
      badge.style.display='inline-flex';
      badge.innerHTML = ICOK + '<span>Aprovado como Final' + (d ? (' em '+d.toLocaleDateString('pt-BR')) : '') + '</span>';
    } else {
      badge.style.display='none';
      badge.innerHTML='';
    }
  }

  /* ---------- equipamento ---------- */
  const EQUIP_ICONS={ elios3:IC_DRONE, elios2:IC_DRONE, go2:IC_DOG, g1:IC_PERSON, rover:IC_CAR };
  function renderEquip(){
    const box=document.getElementById('pcEquipBody');
    box.innerHTML = EQUIP_ITEMS.map(it=>{
      const on=STATE.equip[it.key];
      let qual='';
      if(on && EQUIP_VARIANTS[it.key]){
        const varKey=it.key+'Variante';
        const current = STATE.equip[varKey] || EQUIP_VARIANTS[it.key][0];
        qual = `<select class="ra-qual" onclick="event.stopPropagation()" onchange="setEquipVariante('${it.key}', this.value)">`
          + EQUIP_VARIANTS[it.key].map(v=>`<option value="${v}" ${v===current?'selected':''}>${v}</option>`).join('')
          + `</select>`;
      }
      const icon = EQUIP_ICONS[it.key] || IC_DRONE;
      return `<div class="ra-chip ${on?'on':''}" onclick="toggleEquip('${it.key}')"><span class="box">${ICOK}</span>${icon}<span class="lbl">${it.label}</span></div>${qual}`;
    }).join('');
  }
  function toggleEquip(key){
    STATE.equip[key]=!STATE.equip[key];
    if(STATE.equip[key]){
      if(EQUIP_VARIANTS[key] && !STATE.equip[key+'Variante']) STATE.equip[key+'Variante']=EQUIP_VARIANTS[key][0];
      applyEquipPreset(key);
    }
    renderEquip(); markDirty(); updateTailstrip(); updateProgress();
  }
  function setEquipVariante(key, value){
    STATE.equip[key+'Variante']=value;
    applyEquipPreset(key);
    markDirty(); updateTailstrip(); updateProgress();
  }
  function applyEquipPreset(key){
    let presetKey=key;
    if(EQUIP_VARIANTS[key]){
      const variant=(STATE.equip[key+'Variante']||EQUIP_VARIANTS[key][0]).toLowerCase();
      presetKey=key+'_'+variant;
    }
    const preset=EQUIP_PRESETS[presetKey];
    if(!preset) return;
    STATE.drone = Object.assign({}, STATE.drone, preset);
    syncDroneFieldsToUI();
  }
  function syncDroneFieldsToUI(){
    document.querySelectorAll('#viewDoc [data-path^="drone."]').forEach(el=>{
      const val=getPath(STATE, el.dataset.path);
      el.value = (val===undefined || val===null) ? '' : val;
    });
  }

  /* ---------- image zone (genérica) ---------- */
  function renderZone(id, box, val, setter){
    if(!box) return;
    if(val){
      box.className='imgzone has-img';
      box.innerHTML = `<img src="${val}" alt="anexo">
        <div class="imgbar">
          <button class="imgbtn draw" type="button">${IC_DRAW}Desenhar / Anotar</button>
          <label class="imgbtn">${IC_EDIT}Substituir<input type="file" accept="image/*"></label>
          <button class="imgbtn danger" type="button">${IC_TRASH}Remover</button>
        </div>`;
      box.querySelector('input[type=file]').addEventListener('change', ev=>{
        const f=ev.target.files[0]; if(!f) return;
        const r=new FileReader(); r.onload=()=>{ setter(r.result); renderZone(id, box, r.result, setter); markDirty(); updateProgress(); }; r.readAsDataURL(f);
      });
      box.querySelector('.imgbtn.danger').addEventListener('click', ()=>{ setter(null); renderZone(id, box, null, setter); markDirty(); updateProgress(); });
      box.querySelector('.imgbtn.draw').addEventListener('click', ()=>{
        openDiagramEditor(val, out=>{ setter(out); renderZone(id, box, out, setter); markDirty(); updateProgress(); });
      });
    } else {
      box.className='imgzone';
      box.innerHTML = `<label class="ph" style="cursor:pointer">
          ${IC_IMG}
          <span class="t">Clique para anexar imagem</span>
          <span class="s">PNG, JPG</span>
          <input type="file" accept="image/*">
        </label>
        <button class="imgbtn draw standalone" type="button">${IC_DRAW}Ou criar desenho / diagrama</button>`;
      box.querySelector('input[type=file]').addEventListener('change', ev=>{
        const f=ev.target.files[0]; if(!f) return;
        const r=new FileReader(); r.onload=()=>{ setter(r.result); renderZone(id, box, r.result, setter); markDirty(); updateProgress(); }; r.readAsDataURL(f);
      });
      box.querySelector('.imgbtn.draw').addEventListener('click', (ev)=>{
        ev.stopPropagation();
        openDiagramEditor(null, out=>{ setter(out); renderZone(id, box, out, setter); markDirty(); updateProgress(); });
      });
    }
  }

  /* ---------- editor de desenho / diagrama ---------- */
  let diagCanvas=null, diagCtx=null, diagDpr=1;
  let diagTool='arrow', diagColor='#134074';
  let diagHist=[], diagDrawing=false, diagStart=null, diagCallback=null;
  const DIAG_COLORS=['#134074','#B42318','#1E7B4F','#B5820A','#0B2545','#000000'];

  function renderDiagColors(){
    const box=document.getElementById('pcDiagColors');
    box.innerHTML = DIAG_COLORS.map(c=>`<span class="diag-color ${c===diagColor?'on':''}" style="background:${c}" onclick="setDiagColor('${c}')"></span>`).join('');
  }
  function setDiagColor(c){ diagColor=c; renderDiagColors(); }
  function setDiagTool(t){
    diagTool=t;
    document.querySelectorAll('#pcDiagOverlay .diag-tool[data-tool]').forEach(b=> b.classList.toggle('on', b.dataset.tool===t));
  }
  function pushDiagHist(){
    if(!diagCtx) return;
    diagHist.push(diagCtx.getImageData(0,0,diagCanvas.width,diagCanvas.height));
    if(diagHist.length>40) diagHist.shift();
  }
  function restoreLastDiagHist(){
    if(diagHist.length) diagCtx.putImageData(diagHist[diagHist.length-1],0,0);
  }

  function openDiagramEditor(existingSrc, callback){
    diagCallback=callback;
    document.getElementById('pcDiagOverlay').classList.add('show');
    const wrap=document.querySelector('#pcDiagOverlay .diag-canvas-wrap');
    requestAnimationFrame(()=>{
      const rect=wrap.getBoundingClientRect();
      diagDpr=window.devicePixelRatio||1;
      diagCanvas=document.getElementById('pcDiagCanvas');
      diagCanvas.width=Math.round(rect.width*diagDpr);
      diagCanvas.height=Math.round(rect.height*diagDpr);
      diagCtx=diagCanvas.getContext('2d');
      diagCtx.setTransform(diagDpr,0,0,diagDpr,0,0);
      diagCtx.fillStyle='#ffffff';
      diagCtx.fillRect(0,0,rect.width,rect.height);
      diagHist=[];
      if(existingSrc){
        const img=new Image();
        img.onload=()=>{
          const cw=rect.width, ch=rect.height;
          const scale=Math.min(cw/img.width, ch/img.height);
          const dw=img.width*scale, dh=img.height*scale;
          const dx=(cw-dw)/2, dy=(ch-dh)/2;
          diagCtx.fillStyle='#ffffff'; diagCtx.fillRect(0,0,cw,ch);
          diagCtx.drawImage(img, dx,dy,dw,dh);
          pushDiagHist();
        };
        img.src=existingSrc;
      } else {
        pushDiagHist();
      }
      setDiagTool('arrow'); renderDiagColors();
      setupDiagPointerEvents();
    });
  }
  function setupDiagPointerEvents(){
    const canvas=diagCanvas;
    function pos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
    canvas.onpointerdown=(e)=>{
      e.preventDefault();
      const p=pos(e);
      if(diagTool==='drone'){ drawDroneStamp(p.x,p.y); pushDiagHist(); return; }
      if(diagTool==='person'){ drawPersonStamp(p.x,p.y); pushDiagHist(); return; }
      if(diagTool==='dog'){ drawDogStamp(p.x,p.y); pushDiagHist(); return; }
      if(diagTool==='car'){ drawCarStamp(p.x,p.y); pushDiagHist(); return; }
      if(diagTool==='dot'){ drawDot(p.x,p.y); pushDiagHist(); return; }
      if(diagTool==='text'){
        const txt=window.prompt('Texto do rótulo:');
        if(txt){ drawLabel(p.x,p.y,txt); pushDiagHist(); }
        return;
      }
      diagDrawing=true; diagStart=p;
      try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    };
    canvas.onpointermove=(e)=>{
      if(!diagDrawing) return;
      const p=pos(e);
      restoreLastDiagHist();
      if(diagTool==='arrow') drawArrow(diagStart.x,diagStart.y,p.x,p.y);
      else if(diagTool==='line') drawLine(diagStart.x,diagStart.y,p.x,p.y);
      else if(diagTool==='dashed') drawDashedLine(diagStart.x,diagStart.y,p.x,p.y);
    };
    canvas.onpointerup=(e)=>{
      if(!diagDrawing) return;
      diagDrawing=false;
      const p=pos(e);
      restoreLastDiagHist();
      if(diagTool==='arrow') drawArrow(diagStart.x,diagStart.y,p.x,p.y);
      else if(diagTool==='line') drawLine(diagStart.x,diagStart.y,p.x,p.y);
      else if(diagTool==='dashed') drawDashedLine(diagStart.x,diagStart.y,p.x,p.y);
      pushDiagHist();
    };
  }
  function drawArrow(x1,y1,x2,y2){
    const ctx=diagCtx;
    const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
    if(len<2) return;
    ctx.strokeStyle=diagColor; ctx.fillStyle=diagColor; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const angle=Math.atan2(dy,dx), headLen=Math.min(16,len*0.5);
    ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2-headLen*Math.cos(angle-Math.PI/7), y2-headLen*Math.sin(angle-Math.PI/7));
    ctx.lineTo(x2-headLen*Math.cos(angle+Math.PI/7), y2-headLen*Math.sin(angle+Math.PI/7));
    ctx.closePath(); ctx.fill();
  }
  function drawLine(x1,y1,x2,y2){
    const ctx=diagCtx;
    ctx.strokeStyle=diagColor; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  function drawDashedLine(x1,y1,x2,y2){
    const ctx=diagCtx;
    ctx.save();
    ctx.strokeStyle=diagColor; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.setLineDash([11,9]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.restore();
  }
  function drawPersonStamp(x,y){
    const ctx=diagCtx;
    ctx.save(); ctx.translate(x,y);
    ctx.strokeStyle=diagColor; ctx.fillStyle=diagColor; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.arc(0,-11,3.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,-7.6); ctx.lineTo(0,4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7,-2.5); ctx.lineTo(7,-2.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(-6.5,13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(6.5,13); ctx.stroke();
    ctx.restore();
  }
  function drawDogStamp(x,y){
    const ctx=diagCtx;
    ctx.save(); ctx.translate(x,y);
    ctx.strokeStyle=diagColor; ctx.fillStyle=diagColor; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(-4,-5); ctx.lineTo(-8,-12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4,-5); ctx.lineTo(8,-12); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,6,3.4,2.2,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-3,-2,1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3,-2,1,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawCarStamp(x,y){
    const ctx=diagCtx;
    ctx.save(); ctx.translate(x,y);
    ctx.strokeStyle=diagColor; ctx.fillStyle=diagColor; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(-10,3); ctx.lineTo(-8,-3); ctx.lineTo(-4,-6); ctx.lineTo(4,-6); ctx.lineTo(8,-3); ctx.lineTo(10,3);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-11,3); ctx.lineTo(11,3); ctx.stroke();
    ctx.beginPath(); ctx.arc(-5,5.5,2.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5,5.5,2.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawDot(x,y){
    const ctx=diagCtx;
    ctx.fillStyle=diagColor;
    ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  }
  function drawDroneStamp(x,y){
    const ctx=diagCtx;
    ctx.save(); ctx.translate(x,y);
    ctx.strokeStyle=diagColor; ctx.fillStyle=diagColor; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,0,3.5,0,Math.PI*2); ctx.fill();
    [[-9,-9],[9,-9],[-9,9],[9,9]].forEach(([ax,ay])=>{
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ax,ay); ctx.stroke();
      ctx.beginPath(); ctx.arc(ax,ay,3.5,0,Math.PI*2); ctx.stroke();
    });
    ctx.restore();
  }
  function drawLabel(x,y,text){
    const ctx=diagCtx;
    ctx.font='600 13px "IBM Plex Sans", sans-serif';
    ctx.textBaseline='middle';
    const padX=6; const w=ctx.measureText(text).width;
    ctx.fillStyle='rgba(255,255,255,.92)';
    ctx.fillRect(x-padX, y-11, w+padX*2, 22);
    ctx.fillStyle=diagColor;
    ctx.fillText(text, x, y);
  }
  function undoDiagram(){ if(diagHist.length>1){ diagHist.pop(); restoreLastDiagHist(); } }
  function clearDiagram(){
    const rect=diagCanvas.getBoundingClientRect();
    diagCtx.fillStyle='#ffffff'; diagCtx.fillRect(0,0,rect.width,rect.height);
    pushDiagHist();
  }
  function closeDiagram(){ document.getElementById('pcDiagOverlay').classList.remove('show'); diagCallback=null; }
  function saveDiagram(){
    if(!diagCanvas || !diagCallback){ closeDiagram(); return; }
    const out=diagCanvas.toDataURL('image/png');
    const cb=diagCallback;
    closeDiagram();
    cb(out);
  }

  /* ---------- galeria ---------- */
  function renderGallery(){
    const box=document.getElementById('pcGalleryBody');
    box.innerHTML='';
    STATE.galeria.forEach((item,i)=>{
      const cell=document.createElement('div');
      cell.className='gallery-item';
      cell.innerHTML=`<button class="gdel" type="button">${IC_TRASH}</button>
        <input class="gtitle" placeholder="Título" value="${item.titulo||''}">
        <div class="gzone"></div>`;
      cell.querySelector('.gtitle').addEventListener('input', e=>{ STATE.galeria[i].titulo=e.target.value; markDirty(); });
      cell.querySelector('.gdel').addEventListener('click', ()=>{ STATE.galeria.splice(i,1); renderGallery(); markDirty(); updateProgress(); });
      box.appendChild(cell);
      renderZone('g'+i, cell.querySelector('.gzone'), item.img, v=>{ STATE.galeria[i].img=v; });
    });
  }
  function addGalleryItem(){ STATE.galeria.push({titulo:'', img:null}); renderGallery(); markDirty(); }

  /* ---------- etapas ---------- */
  function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderEtapas(){
    const wrap=document.getElementById('pcEtapasWrap');
    wrap.innerHTML = STATE.etapas.map((item,i)=>{
      const num=String(i+1).padStart(2,'0');
      return `
      <div class="lb-section">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h6l2-8 4 16 2-8h6"/></svg><span class="etapa-prefix">Etapa ${num} —</span><input class="etapa-title-input" data-id="${item.id}" placeholder="Título da etapa" value="${escapeAttr(item.titulo)}"><button class="etapa-del" type="button" data-id="${item.id}" title="Remover etapa">${IC_TRASH}</button></h3>
        <div class="etapa-block">
          <div class="lb-field"><label>Descrição</label><textarea class="tall" id="pcEtapa_${item.id}"></textarea></div>
          <div>
            <div class="lb-field"><label>Diagrama Ilustrativo</label></div>
            <div id="pcZoneEtapa_${item.id}"></div>
          </div>
        </div>
      </div>`;
    }).join('') + `<div class="etapas-addbar"><button class="tbl-addrow" id="pcAddEtapaBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Adicionar etapa</button></div>`;

    STATE.etapas.forEach(item=>{
      const ta=document.getElementById('pcEtapa_'+item.id);
      ta.value = item.desc || '';
      ta.addEventListener('input', ()=>{ item.desc=ta.value; markDirty(); updateProgress(); });
      renderZone('etapa_'+item.id, document.getElementById('pcZoneEtapa_'+item.id), item.img, v=>{ item.img=v; });
    });

    wrap.querySelectorAll('.etapa-title-input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const it=STATE.etapas.find(e=>e.id===inp.dataset.id);
        if(it){ it.titulo=inp.value; markDirty(); }
      });
    });

    wrap.querySelectorAll('.etapa-del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(STATE.etapas.length<=1){ toast('É necessário manter ao menos 1 etapa'); return; }
        if(!confirm('Remover esta etapa? Esta ação não pode ser desfeita.')) return;
        STATE.etapas = STATE.etapas.filter(e=>e.id!==btn.dataset.id);
        renderEtapas(); markDirty(); updateProgress();
      });
    });

    document.getElementById('pcAddEtapaBtn').addEventListener('click', addEtapa);
  }

  function addEtapa(){
    const id='e'+Date.now().toString(36)+Math.floor(Math.random()*1000);
    STATE.etapas.push({id, titulo:'Nova etapa', desc:'', img:null});
    renderEtapas(); markDirty(); updateProgress();
    const wrap=document.getElementById('pcEtapasWrap');
    const newInput=wrap.querySelector(`.etapa-title-input[data-id="${id}"]`);
    if(newInput){ newInput.scrollIntoView({behavior:'smooth', block:'center'}); newInput.focus(); }
  }

  /* ---------- contingência agree ---------- */
  function renderAgree(){
    const el=document.getElementById('pcContAgree'); if(!el) return;
    el.classList.toggle('on', !!STATE.contingencia.agree);
  }

  /* ---------- progresso ---------- */
  function updateProgress(){
    const checks=[
      STATE.meta.empresa, STATE.meta.estrutura, STATE.meta.ativosDescricoes, STATE.meta.data,
      STATE.time.operador1, STATE.time.tipoServico,
      (STATE.equip.elios3||STATE.equip.elios2||STATE.equip.go2||STATE.equip.g1||STATE.equip.rover),
      STATE.objetivo, STATE.localidadeImg, STATE.coordenadas, STATE.entregaveis,
      STATE.seguranca.procedimentos,
      STATE.escopo.descricao, STATE.escopo.pontosInteresse,
      STATE.ativoCaracteristicas,
      STATE.tempo.previsao,
    ];
    STATE.etapas.forEach(e=>{ checks.push(e.titulo, e.desc, e.img); });
    checks.push(
      STATE.contingencia.agree,
      STATE.responsaveis.operador1!=='' && STATE.responsaveis.operador1!=='A definir',
      STATE.responsaveis.operador2!=='' && STATE.responsaveis.operador2!=='A definir'
    );
    // (percentual calculado, mas sem indicador visual dedicado — o cabeçalho
    // já mostra "Rascunho não salvo"/"Salvo neste navegador", igual aos outros diários)
  }

  /* ---------- salvar / novo plano / toast ---------- */
  function pcSave(showToast){
    if(!STATE) return;
    STATE.savedAt=new Date().toISOString();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){ console.error(e); }
    markStatus(true); DIRTY=false;
    if(showToast) toast('Plano salvo neste navegador');
  }
  function pcReset(){
    if(!confirm('Isso vai limpar todos os campos preenchidos neste navegador e restaurar os textos-padrão. Deseja continuar?')) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    if(CURRENT_NODE) renderPlanoCaptura(CURRENT_NODE);
  }
  let toastTimer=null;
  function toast(msg){
    const el=document.getElementById('pcToast');
    if(!el) return;
    document.getElementById('pcToastText').textContent=msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>el.classList.remove('show'), 2600);
  }

  window.addEventListener('beforeunload', ()=>{ if(DIRTY && STATE) pcSave(false); });

  /* ---------- exposição global (necessária para os onclick="" do HTML) ---------- */
  window.renderPlanoCaptura = renderPlanoCaptura;
  window.approvePlan = approvePlan;
  window.toggleEquip = toggleEquip;
  window.setEquipVariante = setEquipVariante;
  window.addGalleryItem = addGalleryItem;
  window.setDiagTool = setDiagTool;
  window.setDiagColor = setDiagColor;
  window.undoDiagram = undoDiagram;
  window.clearDiagram = clearDiagram;
  window.closeDiagram = closeDiagram;
  window.saveDiagram = saveDiagram;
  window.pcSave = pcSave;
  window.pcReset = pcReset;
})();

  eyeBtn.addEventListener('click', ()=>{

</script>
